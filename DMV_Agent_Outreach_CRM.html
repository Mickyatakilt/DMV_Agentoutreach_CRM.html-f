      + '.record{margin-top:8px} .record h2{font-size:15px;margin:0 0 10px}'
      + 'table{border-collapse:collapse;width:100%;margin:0 0 12px} td{border:1px solid #d0d0d0;padding:6px 10px;vertical-align:top} td.lbl{width:170px;font-weight:bold;background:#f5f5f5}'
      + '.attest{font-size:12px;color:#333} .pb{page-break-before:always}'
      + '@media print{ body{padding:0.6in} }'
      + '</style></head><body>'
      + '<h1>Lead Protection &amp; Non-Circumvention Agreement</h1>'
      + '<p class="org">Hiredwise LLC / Mestate Investment Group</p>'
      + '<div class="clauses">'+AGREEMENT_CLAUSES_HTML+'</div>'

    w.document.open(); w.document.write(doc); w.document.close();

let activityCheckpoint = localStorage.getItem('crm_activity_checkpoint') || '1970-01-01T00:00:00.000Z';
let pendingActivityEntries = [];
function computePendingActivity(){
  var entries = [];
  leads.forEach(function(l){
    if(l.deleted) return;
    (l.activityLog||[]).forEach(function(e){
      if(e.at > activityCheckpoint) entries.push({kind:'lead', id:l.id, label:l.address||l.name||'Lead #'+l.id, type:e.type, by:e.by, at:e.at, note:e.note});
    });
  });
  jvLeads.forEach(function(l){
    if(l.deleted) return;
    (l.activityLog||[]).forEach(function(e){
      if(e.at > activityCheckpoint) entries.push({kind:'task', id:l.id, label:l.location||l.name||'Task #'+l.id, type:e.type, by:e.by, at:e.at, note:e.note});
    });
  });
  entries.sort(function(a,b){ return new Date(b.at) - new Date(a.at); });
  pendingActivityEntries = entries;
}
function activityBannerHTML(){

    +'<span>&#128276; <b>'+pendingActivityEntries.length+'</b> new activity update'+(pendingActivityEntries.length===1?'':'s')+' since your last visit</span>'

// ===== Trash: view/restore/permanently-delete soft-deleted leads and tasks =====
function showTrash(){
  var deadLeads = leads.filter(function(l){return l.deleted;}).map(function(l){ return Object.assign({kind:'lead'}, l); });
  var deadTasks = jvLeads.filter(function(l){return l.deleted;}).map(function(l){ return Object.assign({kind:'task'}, l); });
  var combined = deadLeads.concat(deadTasks).sort(function(a,b){
    var da=a.deletedAt||'', db=b.deletedAt||'';
    return db>da?1:db<da?-1:0;
  });
  var rows = combined.length===0
    ? '<div style="padding:20px 0;text-align:center;color:var(--text3);font-size:13px">Trash is empty</div>'
    : combined.map(function(l){
        var label = l.kind==='task' ? (l.location||l.name||'Task #'+l.id) : (l.address||l.name||'Lead #'+l.id);
        var badge = l.kind==='task' ? '<span style="font-size:9px;font-weight:900;color:#0369a1;background:#e0f2fe;border:1px solid #7dd3fc;border-radius:4px;padding:1px 5px;margin-right:6px">TASK</span>' : '<span style="font-size:9px;font-weight:900;color:#dc2626;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;padding:1px 5px;margin-right:6px">DMV</span>';
        var when = l.deletedAt ? new Date(l.deletedAt).toLocaleString() : '';
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">'
          + '<div>' + badge + '<span style="font-weight:600;font-size:13px">'+esc(label)+'</span><div style="font-size:11px;color:var(--text3);margin-top:2px">Deleted '+when+'</div></div>'
          + '<div style="display:flex;gap:6px"><button class="btn btn-secondary btn-sm" onclick="restoreFromTrash(\''+l.kind+'\','+l.id+')">&#8617; Restore</button><button class="btn btn-danger btn-sm" onclick="permanentlyDelete(\''+l.kind+'\','+l.id+')">Delete Forever</button></div>'
          + '</div>';
      }).join('');
  document.getElementById('modal-container').innerHTML = '<div class="modal-overlay" onclick="overlayClick(event)"><div class="modal" style="max-width:560px"><div class="modal-header"><div class="modal-title">&#128465; Trash</div><button class="modal-close-btn" onclick="closeModal()">&#10005;</button></div><div class="modal-body">'
    + '<p style="font-size:12px;color:var(--text3);margin-bottom:10px">Deleted leads and tasks stay here until you restore them or delete them forever.</p>'
    + rows
    + '</div><div class="modal-footer"><button class="btn btn-secondary btn-sm" onclick="closeModal()">Close</button></div></div></div>';
}
function restoreFromTrash(kind, id){
  if(kind==='task'){
    var l = jvLeads.find(function(x){return x.id===id;});
    if(!l) return;
    l.deleted=false; l.deletedAt='';
    saveJV(); saveJVToSupabase(l);
  } else {
    var l2 = leads.find(function(x){return x.id===id;});
    if(!l2) return;
    l2.deleted=false; l2.deletedAt='';
    save(); saveLeadToSupabase(l2);
  }
  showTrash(); render();
  showToast('Restored','success');
}
function permanentlyDelete(kind, id){
  if(!confirm('Permanently delete this? This truly cannot be undone.')) return;
  if(kind==='task'){
    jvLeads = jvLeads.filter(function(x){return x.id!==id;});
    saveJV(); deleteJVFromSupabase(id);
  } else {
    leads = leads.filter(function(x){return x.id!==id;});
    save(); deleteLeadFromSupabase(id);
  }
  showTrash(); render();
  showToast('Permanently deleted','warning');
}

function sendLeadEmailNow(kind, id, memberIdx){
  var members = getTeamMembers();
  var m = members[memberIdx];
  if(!m) return;
  var name, phone, askingPrice, address;
  if(id!==null){
    // Existing saved lead/task (detail view)
    if(kind==='task'){
      var l = jvLeads.find(function(x){return x.id===id;});
      if(!l) return;
      name = l.name; phone = l.phone; askingPrice = l.askingPrice; address = l.location;
    } else {

      if(!l2) return;
      name = l2.name; phone = l2.phone; askingPrice = l2.offer; address = l2.address;
    }
  } else {
    // Not-yet-saved Add/Edit form — read straight from the open input fields
    if(kind==='task'){

      phone = (document.getElementById('t-phone')||{}).value || '';
      askingPrice = (document.getElementById('t-askingprice')||{}).value || '';

    } else {

      phone = (document.getElementById('f-phone')||{}).value || '';
      askingPrice = (document.getElementById('f-offer')||{}).value || '';
      address = (document.getElementById('f-address')||{}).value || '';
    }
  }
  // NOTE: the outreach email deliberately contains NO seller name/phone/price/address.
  // All lead details stay behind the Lead Protection Agreement gate on the link below.
  var subject = 'New Lead from the Team of M-Estate';
  var body = 'Hello ' + (m.name||'') + ',\n\n'
    + 'Here is a new lead from the Team of M-Estate. The link below contains all of the lead information — property, phone, notes, and more.\n\n'
    + 'Before the lead is revealed, you will be asked to review and accept a short Lead Protection & Non-Circumvention Agreement and enter your first and last name. Once you agree, the full lead will be shown to you.';
  if(kind==='lead' && id!==null){
    var baseUrl = GITHUB_PAGES_URL;
    body += '\n\nOpen your lead here: ' + baseUrl + '?shared=lead&id=' + id;
    var sharedLead = leads.find(function(x){return x.id===id;});
    if(sharedLead){
      sharedLead.shared = true;
      sharedLead.sharedAt = new Date().toISOString();
      sharedLead.sharedWith = m.email;
      // Record the send against THIS lead so there's a trail of who emailed it and to whom.
      if(!sharedLead.activityLog) sharedLead.activityLog=[];
      sharedLead.activityLog.push({type:'Emailed', by:(currentUser&&currentUser.name)||'Team', at:new Date().toISOString(), note:'Sent to '+m.name+' ('+m.email+')'});
      // Feature C: sending a lead also puts it in the Review queue, stamped with who sent it + when.
      sharedLead.needsReview = true;
      sharedLead.reviewSentBy = (currentUser&&currentUser.name)||'Team';
      sharedLead.reviewSentAt = new Date().toISOString();
      localStorage.setItem('crm_leads', JSON.stringify(leads));
      saveLeadToSupabase(sharedLead);
    }
  } else if(kind==='task' && id!==null){
    var baseUrlT = GITHUB_PAGES_URL;
    body += '\n\nOpen your lead here: ' + baseUrlT + '?shared=task&id=' + id;
    var sharedTask = jvLeads.find(function(x){return x.id===id;});
    if(sharedTask){
      sharedTask.shared = true;
      sharedTask.sharedAt = new Date().toISOString();
      sharedTask.sharedWith = m.email;
      if(!sharedTask.activityLog) sharedTask.activityLog=[];
      sharedTask.activityLog.push({type:'Emailed', by:(currentUser&&currentUser.name)||'Team', at:new Date().toISOString(), note:'Sent to '+m.name+' ('+m.email+')'});
      saveJV();
      saveJVToSupabase(sharedTask);
    }
  }
  var mailto = 'mailto:' + encodeURIComponent(m.email) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  window.location.href = mailto;
  var menu = document.getElementById('send-team-menu'); if(menu) menu.remove();
  showToast('Email drafted to ' + m.name + ' (' + m.email + ') — check your mail app', 'success');
}

function onGlobalSearch(q){

  var results = [];
  leads.forEach(function(l){
    if(l.deleted) return;

      results.push({type: l.nationwide==='Yes'?'nationwide':'dmv', id:l.id, title:l.address||l.name||'(no address)', sub:[l.name,l.phone].filter(Boolean).join(' &middot; ')});

// STARTUP -- works on Chrome, Safari, Firefox, Edge, any computer
// 1. Show local data instantly (no waiting)
// 2. Sync with Supabase cloud in background
// 3. Re-render with latest cloud data
// 4. Auto-refresh every 30 seconds to catch changes from other users
async function initFullApp() {
  // Step 1: Load local data immediately so UI shows fast
  try {
    var stored = localStorage.getItem('crm_leads');
    if(stored) leads = JSON.parse(stored);
  } catch(e) {}
  if(!leads || leads.length === 0) {
    leads = RAW_DATA.map(function(l){ return Object.assign({},l,{followUpDate:l.followUpDate||'',nationwide:l.nationwide||''}); });
  }
  computePendingActivity();
  render();

  // Step 2: Sync with cloud
  var synced = await loadFromSupabase();
  await loadJVFromSupabase();
  if(synced) { computePendingActivity(); render(); }
  computePendingActivity(); render();

  // Step 3: Auto-refresh every 30 seconds to catch other users' changes
  setInterval(async function() {
    if(pendingSaves > 0) return; // an edit hasn't finished syncing yet -- don't let this poll stomp it
    try {
      var rows = await sbFetch('leads?select=*&order=id.asc&limit=1000');
      if(rows && rows.length > 0) {
        var newLeads = rows.map(fromRow);
        // Only re-render if data actually changed
        if(JSON.stringify(newLeads) !== JSON.stringify(leads)) {
          leads = newLeads;
          localStorage.setItem('crm_leads', JSON.stringify(leads));
          showSyncStatus('synced');
          computePendingActivity();
          render();
        }
      }
    } catch(e) { showSyncStatus('offline'); }
  }, 30000);

  // Step 4: Same 30-second auto-refresh for Tasks
  setInterval(async function() {
    if(pendingSaves > 0) return;
    try {
      var jvRows = await sbFetch('jv_leads?select=*&order=id.asc&limit=1000');
      if(jvRows && jvRows.length > 0) {
        var newJV = jvRows.map(fromJVRow);
        if(JSON.stringify(newJV) !== JSON.stringify(jvLeads)) {
          jvLeads = newJV;
          saveJV();
          computePendingActivity();
          render();
        }
      }
    } catch(e) {}
  }, 30000);
}

// ===== Shared single-lead view =====
// A restricted link (?shared=lead&id=123) that shows ONLY that one lead -- no other tabs,
// no other leads, no login. Recipient can view details/links and adjust Marketing Type,
// Status, Follow-Up Date, and Notes only. Saves go straight to Supabase by that lead's id.
// ---- Agreement gate helpers (recipient side) ----
// The token is proof-of-acceptance for ONE lead. Stored per-lead so a refresh or a
// return visit does not re-prompt, but accepting Lead A never unlocks Lead B.
function agreementToken(kind, id){ try { return localStorage.getItem('agree_'+kind+'_'+id)||''; } catch(e){ return ''; } }
function setAgreementToken(kind, id, token){ try { localStorage.setItem('agree_'+kind+'_'+id, token); } catch(e){} }

async function agreementCall(body){
  var r = await fetch(AGREEMENT_FN_URL, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  var txt = await r.text();
  var data = txt ? JSON.parse(txt) : {};
  if(!r.ok) throw new Error((data && data.error) || ('HTTP '+r.status));
  return data;
}

              ${l.comps&&l.comps.startsWith('http')?'<div><a href="'+esc(l.comps.split(' ')[0])+'" target="_blank" class="detail-link">View Comps &#8599;</a></div>':''}
            </div>
          </div>
          <div class="form-section"><div class="form-section-title">Update This Lead</div>
            <div class="form-grid">
              <div class="form-field"><label class="form-label">Marketing Type</label><select id="shared-mkt" class="form-select">${mktOpts}</select></div>
              <div class="form-field"><label class="form-label">Status</label><select id="shared-status" class="form-select">${statusOpts}</select></div>
              <div class="form-field"><label class="form-label">Lead Temperature</label><select id="shared-score" class="form-select"><option value="" ${!l.score?'selected':''}>&#8212; Not set &#8212;</option><option value="Hot" ${l.score==='Hot'?'selected':''}>&#128308; Hot</option><option value="Warm" ${l.score==='Warm'?'selected':''}>&#128993; Warm</option><option value="Cold" ${l.score==='Cold'?'selected':''}>&#128309; Cold</option></select></div>
              <div class="form-field"><label class="form-label">Team Follow-Up Date</label><input type="date" class="form-input" value="${l.followUpDate||''}" disabled style="opacity:.7;background:var(--bg2,#f2f2f4);cursor:not-allowed"><div class="field-hint" style="color:var(--text4)">Set by the M-Estate team &middot; read-only</div></div>
              <div class="form-field"><label class="form-label">&#128197; Your Follow-Up Date</label><input id="shared-recip-followup" type="date" class="form-input" value="${l.recipientFollowUpDate||''}"><div class="field-hint"><a href="#" onclick="event.preventDefault();openGCalForShared('shared-recip-followup','${esc(l.address||'Lead')}');" style="color:var(--accent)">&#128197; Add to Google Calendar</a></div></div>
            </div>
          </div>
          <div class="detail-section"><div class="detail-section-title">Original Lead Notes</div>${l.notes?'<div class="notes-box" style="white-space:pre-wrap">'+esc(l.notes)+'</div>':'<div style="color:var(--text4);font-size:12px">No notes</div>'}</div>
          ${renderSharedRecipientNotes()}
          <div id="shared-save-status" style="font-size:12px;color:var(--green);margin-bottom:8px"></div>
          <div id="shared-activity-section">${renderSharedActivityLog()}</div>
        </div>
        <div class="modal-footer"><button class="btn btn-primary" onclick="saveSharedLead(${l.id})">&#128190; Save Update</button></div>
      </div>
    </div>`;
}
async function saveSharedLead(id) {
  // NOTE: original `notes` is intentionally NOT written here — recipients edit their own
  // Recipient Notes (recipient_notes) instead, so the original lead notes are never overwritten.
  var body = {
    marketing_type: document.getElementById('shared-mkt').value,
    status: document.getElementById('shared-status').value,
    score: document.getElementById('shared-score').value,
    recipient_follow_up_date: document.getElementById('shared-recip-followup').value,
    updated_by: (getSharedName() || 'Shared Link'), updated_at: today()
  };
  var statusEl = document.getElementById('shared-save-status');
  try {
    await sbFetch('leads?id=eq.' + id, 'PATCH', body);
    if(statusEl) statusEl.textContent = '\u2713 Saved — thank you!';
  } catch(e) {
    if(statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Could not save — please try again.'; }
  }
}

async function initSharedTaskView(id) {
  document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;color:var(--text3)">Loading&#8230;</div>';
  try {
    var data = await agreementCall({ action:'get', leadId:id, kind:'task', token: agreementToken('task', id) });
    if(data.needsAgreement){ renderAgreementGate(id, 'task'); return; }
    if(!data.lead){ agreementNotFound(); return; }
    renderSharedTaskView(fromJVRow(data.lead));
  } catch(e){ renderAgreementGate(id, 'task'); }
}
function renderSharedTaskView(l) {
  var statuses = getJVStatuses();
  var statusOpts = statuses.map(function(s){ return '<option value="'+s+'" '+(l.jvStatus===s?'selected':'')+'>'+s+'</option>'; }).join('');
  sharedActivityKind = 'task';
  sharedActivityId = l.id;
  sharedActivityLog = l.activityLog || [];
  sharedRecipientNotes = l.recipientNotes || [];
  document.getElementById('app').innerHTML = `
    <div class="header"><div class="logo">&#127968; Property Update</div></div>
    <div style="max-width:640px;margin:24px auto;padding:0 16px">
      <div class="modal" style="position:static;box-shadow:var(--shadow-md)">
        <div class="modal-header"><div><div class="modal-title">${esc(l.name)||'Lead'}</div><div class="modal-subtitle">${esc(l.location)||''}</div>${l.location?'<div style="margin-top:4px;font-size:12px"><a href="'+buildZillowUrl(l.location)+'" target="_blank" class="detail-link">&#127968; View on Zillow &#8599;</a> <span style="color:var(--text3);font-size:11px">&middot;</span> <a href="'+buildRedfinUrl(l.location)+'" target="_blank" style="color:var(--text3);font-size:12px">Try Redfin</a></div>':''}</div></div>
        <div class="modal-body">
          <div class="detail-section"><div class="detail-section-title">Details</div>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">Phone</span><span class="detail-val">${esc(l.phone)||''}</span></div>
              <div class="detail-item"><span class="detail-label">Asking Price</span><span class="detail-val" style="color:var(--accent);font-weight:700">${esc(l.askingPrice)||''}</span></div>
              <div class="detail-item"><span class="detail-label">ARV</span><span class="detail-val" style="color:var(--green);font-weight:700">${esc(l.arv)||''}</span></div>
            </div>
          </div>
          ${l.fbLink?'<div class="detail-section"><a href="'+esc(l.fbLink)+'" target="_blank" class="detail-link">View Facebook Post &#8599;</a></div>':''}
          <div class="form-section"><div class="form-section-title">Update This Lead</div>
            <div class="form-grid">
              <div class="form-field"><label class="form-label">Status</label><select id="shared-jv-status" class="form-select"><option value="">&#8212; Select &#8212;</option>${statusOpts}</select></div>
              <div class="form-field"><label class="form-label">Lead Temperature</label><select id="shared-jv-score" class="form-select"><option value="" ${!l.score?'selected':''}>&#8212; Not set &#8212;</option><option value="Hot" ${l.score==='Hot'?'selected':''}>&#128308; Hot</option><option value="Warm" ${l.score==='Warm'?'selected':''}>&#128993; Warm</option><option value="Cold" ${l.score==='Cold'?'selected':''}>&#128309; Cold</option></select></div>
              <div class="form-field"><label class="form-label">Team Follow-Up Date</label><input type="date" class="form-input" value="${l.followUpDate||''}" disabled style="opacity:.7;background:var(--bg2,#f2f2f4);cursor:not-allowed"><div class="field-hint" style="color:var(--text4)">Set by the M-Estate team &middot; read-only</div></div>
              <div class="form-field"><label class="form-label">&#128197; Your Follow-Up Date</label><input id="shared-jv-recip-followup" type="date" class="form-input" value="${l.recipientFollowUpDate||''}"><div class="field-hint"><a href="#" onclick="event.preventDefault();openGCalForShared('shared-jv-recip-followup','${esc(l.name||'Lead')}');" style="color:var(--accent)">&#128197; Add to Google Calendar</a></div></div>
            </div>
          </div>
          <div class="detail-section"><div class="detail-section-title">Original Lead Notes</div>${l.notes?'<div class="notes-box" style="white-space:pre-wrap">'+esc(l.notes)+'</div>':'<div style="color:var(--text4);font-size:12px">No notes</div>'}</div>
          ${renderSharedRecipientNotes()}
          <div id="shared-save-status" style="font-size:12px;color:var(--green);margin-bottom:8px"></div>
          <div id="shared-activity-section">${renderSharedActivityLog()}</div>
        </div>
        <div class="modal-footer"><button class="btn btn-primary" onclick="saveSharedTask(${l.id})">&#128190; Save Update</button></div>
      </div>
    </div>`;
}
async function saveSharedTask(id) {
  // original `notes` intentionally NOT written — recipient uses their own Recipient Notes.
  var body = {
    jv_status: document.getElementById('shared-jv-status').value,
    score: document.getElementById('shared-jv-score').value,
    recipient_follow_up_date: document.getElementById('shared-jv-recip-followup').value
  };
  var statusEl = document.getElementById('shared-save-status');
  try {
    await sbFetch('jv_leads?id=eq.' + id, 'PATCH', body);
    if(statusEl) statusEl.textContent = '\u2713 Saved — thank you!';
  } catch(e) {
    if(statusEl) { statusEl.style.color = 'var(--red)'; statusEl.textContent = 'Could not save — please try again.'; }
  }
}

// ===== Route: shared single-lead link vs full app =====
(function(){
  var params = new URLSearchParams(window.location.search);
  var sharedKind = params.get('shared');
  var sharedId = params.get('id');
  if (sharedKind === 'lead' && sharedId) {
    initSharedLeadView(parseInt(sharedId, 10));
  } else if (sharedKind === 'task' && sharedId) {
    initSharedTaskView(parseInt(sharedId, 10));
  } else {
    initFullApp();
  }
})();
</script>
</body>
</html>
