function renderFollowUpsTab(){ document.getElementById('tab-content').innerHTML = buildFollowUpQueueHTML(false); }
function buildFollowUpQueueHTML(nationwideOnly){
  // Source badges
  function srcBadge(type){
    if(type==='dmv')        return '<span style="font-size:9px;font-weight:900;color:#dc2626;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;padding:1px 5px;margin-right:4px">DMV</span>';
    if(type==='nationwide') return '<span style="font-size:10px;margin-right:4px">&#127758;</span>';
    if(type==='task')       return '<span style="font-size:10px;margin-right:4px">&#9989;</span>';
    if(type==='probate')    return '<span style="font-size:9px;font-weight:900;color:#7c3aed;background:#ede9fe;border:1px solid #c4b5fd;border-radius:4px;padding:1px 5px;margin-right:4px">PROBATE</span>';
    return '';
  }

  // DMV Follow-Up queue = DMV Leads + Tasks only. Nationwide Follow-Up queue = Nationwide Leads only.
  // These never mix -- kept as two separate calls so a Nationwide follow-up can never leak into the DMV queue.
  var allFU = [];
  if(nationwideOnly){
    leads.forEach(function(l){
      if(!l.deleted && l.followUpDate && l.nationwide==='Yes'){
        allFU.push({lead:l, type:'nationwide', isTask:false});
      }
    });
  } else {
    leads.forEach(function(l){
      if(!l.deleted && l.followUpDate && l.nationwide!=='Yes'){
        allFU.push({lead:l, type:'dmv', isTask:false});
      }
    });
    jvLeads.forEach(function(l){
      if(!l.deleted && l.followUpDate){
        allFU.push({lead:l, type:'task', isTask:true});
      }
    });
    // Probate follow-ups show here too, tagged PROBATE. (crmProbate loads lazily — kick it off if needed.)
    if(crmProbate===null){
      if(!window.__pbFUloading){ window.__pbFUloading=true; crmProbateFetch().then(function(){ window.__pbFUloading=false; if(activeSection==='outreach'&&activeTab==='followups') renderFollowUpsTab(); }); }
    } else {
      crmProbate.forEach(function(p){
        if(p.followUpDate){ allFU.push({lead:p, type:'probate', isTask:false}); }
      });
    }
  }

  // Sort by follow-up date
  allFU.sort(function(a,b){ return a.lead.followUpDate > b.lead.followUpDate ? 1 : -1; });

  var overdue  = allFU.filter(function(x){ return getFUStatus(x.lead.followUpDate)==='overdue'; });
  var dueToday = allFU.filter(function(x){ return getFUStatus(x.lead.followUpDate)==='today'; });
  var soon     = allFU.filter(function(x){ return getFUStatus(x.lead.followUpDate)==='soon'; });
  var future   = allFU.filter(function(x){ return getFUStatus(x.lead.followUpDate)==='future'; });
  var total    = allFU.length;

  function fuItem(x){
    var l = x.lead;
    var d = daysDiff(l.followUpDate);
    var lbl = d<0 ? Math.abs(d)+'d overdue' : d===0 ? 'Today' : d===1 ? 'Tomorrow' : 'In '+d+'d';
    if(x.type==='probate'){
      var pTitle = l.propertyAddress || l.decedentName || ('Probate #'+l.id);
      var pName = l.prName || l.decedentName || '';
      var pPhone = l.skiptracePhone || '';
      var cal = gcalBtn('Probate follow-up: '+(l.decedentName||l.propertyAddress||('#'+l.id)),l.followUpDate,['Probate lead',(l.state||'')+' '+(l.county||''),pName?('PR: '+pName):'',pPhone?('Phone: '+pPhone):''].filter(Boolean).join('\n'),[l.propertyAddress,l.propertyCity,l.propertyZip].filter(Boolean).join(', '),true);
      return '<div class="followup-item" onclick="setSection(\'probate\');setTimeout(function(){openProbateDetail('+l.id+')},40)" style="cursor:pointer">'
        + '<div style="display:flex;align-items:center;gap:4px;margin-bottom:3px">'+srcBadge('probate')
        + '<div class="followup-item-addr" style="margin:0">'+esc(pTitle)+'</div></div>'
        + '<div class="followup-item-meta">'+pbScorePill(l.score)+'<span>'+esc(pName)+'</span>'+(pPhone?'<span style="color:#059669;font-weight:600">&#128222; '+esc(pPhone)+'</span>':'')+'</div>'
        + '<div class="followup-item-date">'+l.followUpDate+' &middot; '+lbl+'</div>'
        + '<div style="margin-top:5px" onclick="event.stopPropagation()">'+cal+'</div>'
        + '</div>';
    }
    var fn = x.isTask ? 'openJVDetail('+l.id+')' : 'openDetail('+l.id+')';
    var title = l.address || l.name || l.location || '&#8212;';
    var badge = x.isTask ? (l.score ? scoreBadgeHTML(l.score) : jvStatusBadge(l.jvStatus||'')) : statusBadge(l.status);
    return '<div class="followup-item" onclick="'+fn+'" style="cursor:pointer">'
      + '<div style="display:flex;align-items:center;gap:4px;margin-bottom:3px">'
      + srcBadge(x.type)
      + '<div class="followup-item-addr" style="margin:0">'+esc(title)+'</div>'
      + '</div>'
      + '<div class="followup-item-meta">'+badge+'<span>'+esc(l.name||'')+'</span>'+(l.phone?'<a href="#" data-phone="'+l.phone.split('/')[0].trim()+'" data-cid="'+(l.ghlContactId||'')+'" onclick="openGHL(this.dataset.phone,this.dataset.cid,event)" style="color:var(--accent);text-decoration:none" title="'+(l.ghlContactId?'Open contact in GoHighLevel':'Copy number &amp; open GoHighLevel')+'">'+esc(l.phone.split('/')[0].trim())+' &#8599;</a>':'')+'</div>'
      + '<div class="followup-item-date">'+l.followUpDate+' &middot; '+lbl+'</div>'
      + (l.notes?'<div style="font-size:11px;color:var(--text3);margin-top:2px">'+esc((l.notes||'').substring(0,80))+(l.notes&&l.notes.length>80?'&#8230;':'')+'</div>':'')
      + '</div>';
  }

  function fuCard(title, items, hColor, hBg, icon){
    var rows = items.length===0
      ? '<div class="followup-empty">None</div>'
      : items.map(fuItem).join('');
    return '<div class="followup-group">'
      + '<div class="followup-group-header" style="background:'+hBg+';color:'+hColor+'">'
      + '<span>'+icon+' '+title+'</span>'
      + '<span style="background:'+hColor+';color:#fff;border-radius:10px;padding:1px 8px;font-size:11px">'+items.length+'</span>'
      + '</div><div style="max-height:360px;overflow-y:auto">'+rows+'</div></div>';
  }

  var futureRows = future.length===0
    ? '<div class="followup-empty">No upcoming follow-ups</div>'
    : future.map(fuItem).join('');

  // Legend
  var legend = nationwideOnly
    ? '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">'
      + '<span style="font-size:12px;color:var(--text3);font-weight:600">Legend:</span>'
      + '<span style="display:flex;align-items:center;gap:4px;font-size:12px">&#127758; Nationwide</span>'
      + '</div>'
    : '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">'
      + '<span style="font-size:12px;color:var(--text3);font-weight:600">Legend:</span>'
      + '<span style="display:flex;align-items:center;gap:4px;font-size:12px"><span style="font-size:9px;font-weight:900;color:#dc2626;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;padding:1px 5px">DMV</span> DMV Lead</span>'
      + '<span style="display:flex;align-items:center;gap:4px;font-size:12px">&#9989; Task</span>'
      + '<span style="display:flex;align-items:center;gap:4px;font-size:12px"><span style="font-size:9px;font-weight:900;color:#7c3aed;background:#ede9fe;border:1px solid #c4b5fd;border-radius:4px;padding:1px 5px">PROBATE</span> Probate</span>'
      + '</div>';

  return '<div class="followup-container">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
    + '<div><h2 style="font-size:16px;font-weight:700">&#128197; '+(nationwideOnly?'Nationwide Follow-Up Dashboard':'DMV Follow-Up Dashboard')+'</h2>'
    + '<p style="font-size:12px;color:var(--text3);margin-top:3px">Today is '+today()+' &middot; '+total+' total follow-ups</p></div>'
    + '<button class="btn btn-primary btn-sm" onclick="openAdd()">+ Add Lead</button></div>'
    + legend
    + '<div class="followup-grid">'
    + fuCard('Overdue', overdue, '#dc2626', '#fee2e2', '&#128308;')
    + fuCard('Due Today', dueToday, '#b45309', '#fef3c7', '&#128993;')
    + fuCard('Next 3 Days', soon, '#0d9488', '#f0fdfa', '&#128994;')
    + '</div>'
    + '<div class="followup-group" style="margin-top:14px">'
    + '<div class="followup-group-header" style="background:var(--surface3);color:var(--text2)">'
    + '<span>&#128198; All Upcoming</span>'
    + '<span style="background:var(--text3);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px">'+future.length+'</span>'
    + '</div><div style="max-height:500px;overflow-y:auto">'+futureRows+'</div></div>'
    + '</div>';
}

function renderPagination(total){
  const tp=Math.ceil(total/PAGE_SIZE);
  const pages=[];
  for(let i=Math.max(1,currentPage-2);i<=Math.min(tp,currentPage+2);i++) pages.push('<button class="page-btn '+(i===currentPage?'active':'')+'" onclick="goPage('+i+')">'+i+'</button>');
  return '<div class="pagination"><span>'+(((currentPage-1)*PAGE_SIZE)+1)+'&#8211;'+Math.min(currentPage*PAGE_SIZE,total)+' of '+total+'</span><div class="page-btns"><button class="page-btn" onclick="goPage(1)" '+(currentPage===1?'disabled':'')+'>&#171;</button><button class="page-btn" onclick="goPage('+(currentPage-1)+')" '+(currentPage===1?'disabled':'')+'>&#8249;</button>'+pages.join('')+'<button class="page-btn" onclick="goPage('+(currentPage+1)+')" '+(currentPage===tp?'disabled':'')+'>&#8250;</button><button class="page-btn" onclick="goPage('+tp+')" '+(currentPage===tp?'disabled':'')+'>&#187;</button></div></div>';
}

function openDetail(id){modalLead=leads.find(l=>l.id===id);editMode=false;isNew=false;renderDetailModal();}
function monthNameFromDate(dateStr){
  if(!dateStr) return '';
  var names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var parts=dateStr.split('-'); // 'YYYY-MM-DD', avoid timezone shift from `new Date(str)`
  var mIdx=parseInt(parts[1],10)-1;
  return names[mIdx]||'';
}
function ensureMonthOption(name){
  if(!name) return;
  var dd=getDropdowns();
  if(!dd.months.includes(name)){ dd.months.push(name); saveDropdowns(dd); }
}
function syncMonthFromDate(dateVal){
  var name=monthNameFromDate(dateVal);
  if(!name) return;
  ensureMonthOption(name);
  var sel=document.getElementById('f-month');
  if(!sel) return;
  if(!Array.from(sel.options).some(function(o){return o.value===name;})){
    var opt=document.createElement('option'); opt.value=name; opt.textContent=name; sel.appendChild(opt);
  }
  sel.value=name;
}

function buildZillowUrl(address){
  var slug = (address||'').trim().replace(/[#.,]/g,'').replace(/\s+/g,'-');
  if(!slug) return '';
  return 'https://www.zillow.com/homes/'+encodeURIComponent(slug)+'_rb/';
}
function buildRedfinUrl(address){
  // Redfin doesn't offer a clean public address-to-URL scheme like Zillow, so this
  // falls back to a Google search scoped to redfin.com, which reliably surfaces the listing.
  var addr = (address||'').trim();
  if(!addr) return '';
  return 'https://www.google.com/search?q=' + encodeURIComponent('site:redfin.com ' + addr);
}
function buildMapsUrl(address){
  var addr=(address||'').trim();
  if(!addr) return '';
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);
}

// Builds a one-click "Add to Google Calendar" link for a follow-up date. No API/OAuth needed --
// just Google's own event-creation URL, pre-filled. Opens in a new tab for the person to confirm/save.
function buildGCalUrl(dateStr, title, details){
  if(!dateStr) return '';
  var startCompact = dateStr.replace(/-/g,'');
  var dt = new Date(dateStr+'T00:00:00');
  dt.setDate(dt.getDate()+1);
  var pad = function(n){ return String(n).length<2 ? '0'+n : ''+n; };
  var endCompact = dt.getFullYear() + pad(dt.getMonth()+1) + pad(dt.getDate());
  return 'https://www.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(title||'Follow-up')
    + '&dates=' + startCompact + '/' + endCompact
    + '&details=' + encodeURIComponent(details||'');
}

async function saveLead(){
  const addr=document.getElementById('f-address').value.trim();
  if(!addr){showToast('Address is required','error');return;}
  const dup=findDup(addr,modalLead.id);
  if(dup&&!confirm('Duplicate address found:\n"'+dup.address+'"\n\nSave anyway?')) return;
  const l=modalLead;
  const oldFollowUp=l.followUpDate;
  l.address=addr;l.name=document.getElementById('f-name').value.trim();l.phone=document.getElementById('f-phone').value.trim();
  l.offer=document.getElementById('f-offer').value.trim();l.arv=document.getElementById('f-arv').value.trim();
  l.marketingType=document.getElementById('f-mkt').value;l.status=document.getElementById('f-status').value;
  l.leadSource=document.getElementById('f-src').value;l.month=document.getElementById('f-month').value;
  l.date=document.getElementById('f-date').value;l.followUpDate=document.getElementById('f-followup').value;
  l.webLink=document.getElementById('f-link').value.trim();l.comps=document.getElementById('f-comps').value.trim();
  l.notes=document.getElementById('f-notes').value.trim();
  l.score=document.getElementById('f-score').value;
  var bedsEl=document.getElementById('f-beds'); if(bedsEl) l.beds=bedsEl.value.trim();
  var bathsEl=document.getElementById('f-baths'); if(bathsEl) l.baths=bathsEl.value.trim();
  var sqftEl=document.getElementById('f-sqft'); if(sqftEl) l.sqft=sqftEl.value.trim();
  var nrEl=document.getElementById('f-needs-review');
  l.needsReview = (l.nationwide==='Yes' && nrEl) ? nrEl.checked : false;
  l.updatedBy=currentUser.name;l.updatedAt=today();
  if(l.followUpDate && l.followUpDate!==oldFollowUp){
    if(!l.activityLog) l.activityLog=[];
    l.activityLog.push({type:'Follow-Up Set',by:currentUser.name,at:new Date().toISOString(),note:'Follow-up scheduled for '+l.followUpDate});
  }
  const wasNew = isNew;
  if(isNew){leads.push(l);}
  else{const i=leads.findIndex(x=>x.id===l.id);if(i>=0)leads[i]=l;}
  save();render();
  const ok = await saveLeadToSupabase(l);
  if(ok){
    showToast(wasNew?'Lead added!':'Updated!','success');
    // UPDATE 1: a single Save reflects the change immediately. For an existing lead, reopen
    // the DETAIL view so the new follow-up (and every field) is visible right away instead of
    // dropping back to the list. New leads still just close.
    if(wasNew) closeModal(); else openDetail(l.id);
  }
  else{ showToast('Cloud sync failed -- check your connection and try Save again','error'); }
  if(ok && APPS_SCRIPT_URL) syncLeadToSheet(l);
}
function deleteLead(){
  if(!confirm('Delete this lead?\n\n'+modalLead.address)) return;
  const delId=modalLead.id;
  const wasNationwide=modalLead.nationwide==='Yes';
  const l=leads.find(x=>x.id===delId);
  if(!l) return;
  l.deleted=true; l.deletedAt=new Date().toISOString();
  save();closeModal();
  if(wasNationwide) activeTab='nationwide';
  render();
  showToast('Lead deleted','warning',function(){
    l.deleted=false; l.deletedAt='';
    save(); render(); saveLeadToSupabase(l);
    showToast('Restored','success');
  });
  saveLeadToSupabase(l);
}

function exportCSV(){
  const filtered=getFiltered();
  const headers=['ID','Address','Phone','Agent','Offer','ARV','Marketing','Status','Source','Month','Date','Follow-Up Date','Listing Link','Comp Link','Notes'];
  const rows=filtered.map(l=>[l.id,l.address,l.phone,l.name,l.offer,l.arv,l.marketingType,l.status,l.leadSource,l.month,l.date,l.followUpDate,l.webLink,l.comps,(l.notes||'').replace(/,/g,';').replace(/\n/g,' ')].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','));
  const csv=[headers.join(','),...rows].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='DMV_Leads_'+today()+'.csv';a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a);},100);
  showToast('Exported '+filtered.length+' leads','success');
}

function recipientFUAlertCount(){

  function tally(l){ if(!l.deleted && l.shared && l.recipientFollowUpDate){ var st=getFUStatus(l.recipientFollowUpDate); if(st==='overdue'||st==='today') n++; } }
  leads.forEach(tally); jvLeads.forEach(tally);
  return n;
}
// Dashboard of RECIPIENT follow-up dates (the date the person we emailed the lead to set on
// THEIR side). Same Overdue / Due Today / Next 3 Days / All Upcoming layout as the team
// Follow-Up tab, but driven by recipientFollowUpDate and badged as an emailed lead (&#128231;).
function buildRecipientFUHTML(){
  var items=[];
  function collect(l,kind){
    if(l.deleted || !l.shared || !l.recipientFollowUpDate) return;
    items.push({lead:l, kind:kind, date:l.recipientFollowUpDate});
  }
  leads.forEach(function(l){ collect(l,'lead'); });
  jvLeads.forEach(function(l){ collect(l,'task'); });
  items.sort(function(a,b){ return a.date>b.date?1:-1; });

  var overdue  = items.filter(function(x){ return getFUStatus(x.date)==='overdue'; });
  var dueToday = items.filter(function(x){ return getFUStatus(x.date)==='today'; });
  var soon     = items.filter(function(x){ return getFUStatus(x.date)==='soon'; });
  var future   = items.filter(function(x){ return getFUStatus(x.date)==='future'; });

  function fuItem(x){
    var l=x.lead;
    var d=daysDiff(x.date);
    var lbl = d<0 ? Math.abs(d)+'d overdue' : d===0 ? 'Today' : d===1 ? 'Tomorrow' : 'In '+d+'d';
    var fn = x.kind==='task' ? 'openJVDetail('+l.id+')' : 'openDetail('+l.id+')';
    var title = (x.kind==='task' ? (l.address||l.location||l.name) : l.address) || l.name || '&#8212;';
    var badge = x.kind==='task' ? (l.score?scoreBadgeHTML(l.score):jvStatusBadge(l.jvStatus||'')) : statusBadge(l.status);
    var recip = l.sharedWith ? esc(l.sharedWith) : 'Recipient';
    return '<div class="followup-item" onclick="'+fn+'" style="cursor:pointer">'
      + '<div style="display:flex;align-items:center;gap:4px;margin-bottom:3px">'
      + '<span style="font-size:10px;margin-right:2px" title="Sent out by email">&#128231;</span>'
      + '<div class="followup-item-addr" style="margin:0">'+esc(title)+'</div>'
      + '</div>'
      + '<div class="followup-item-meta">'+badge
      + '<span style="font-size:9px;font-weight:800;color:#0369a1;background:#e0f2fe;border:1px solid #7dd3fc;border-radius:4px;padding:1px 5px">&#128100; '+recip+'</span>'
      + '</div>'
      + '<div class="followup-item-date">'+x.date+' &middot; '+lbl+' <span style="color:var(--text4)">(recipient)</span></div>'
      + '</div>';
  }
  function fuCard(title, arr, hColor, hBg, icon){
    var rows = arr.length===0 ? '<div class="followup-empty">None</div>' : arr.map(fuItem).join('');
    return '<div class="followup-group">'
      + '<div class="followup-group-header" style="background:'+hBg+';color:'+hColor+'">'
      + '<span>'+icon+' '+title+'</span>'
      + '<span style="background:'+hColor+';color:#fff;border-radius:10px;padding:1px 8px;font-size:11px">'+arr.length+'</span>'
      + '</div><div style="max-height:320px;overflow-y:auto">'+rows+'</div></div>';
  }
  var total = items.length;
  if(total===0) return '';
  var futureRows = future.length===0 ? '<div class="followup-empty">No upcoming recipient follow-ups</div>' : future.map(fuItem).join('');
  return '<div class="followup-container" style="padding:0;margin-bottom:20px">'
    + '<div style="margin-bottom:10px">'
    + '<h3 style="font-size:14px;font-weight:700">&#128231; Recipient Follow-Ups</h3>'
    + '<p style="font-size:12px;color:var(--text3);margin-top:2px">Follow-up dates the people you emailed leads to set on their side &middot; '+total+' total</p></div>'
    + '<div class="followup-grid">'
    + fuCard('Overdue', overdue, '#dc2626', '#fee2e2', '&#128308;')
    + fuCard('Due Today', dueToday, '#b45309', '#fef3c7', '&#128993;')
    + fuCard('Next 3 Days', soon, '#0d9488', '#f0fdfa', '&#128994;')
    + '</div>'
    + '<div class="followup-group" style="margin-top:14px">'
    + '<div class="followup-group-header" style="background:var(--surface3);color:var(--text2)">'
    + '<span>&#128198; All Upcoming</span>'
    + '<span style="background:var(--text3);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px">'+future.length+'</span>'
    + '</div><div style="max-height:400px;overflow-y:auto">'+futureRows+'</div></div>'
    + '</div>';
}
function renderSentOutTab(){

  const soTasks = jvLeads.filter(l=>!l.deleted&&l.shared).map(function(l){ return Object.assign({kind:'task'}, l); });
  const combined = soLeads.concat(soTasks).sort(function(a,b){
    var da = a.sharedAt||'', db = b.sharedAt||'';
    return db > da ? 1 : db < da ? -1 : (b.id - a.id);
  });
  // Drop any stale selections (records that are no longer shared / were removed).
  var validKeys = {}; combined.forEach(function(l){ validKeys[l.kind+':'+l.id]=true; });
  sentOutSelected.forEach(function(k){ if(!validKeys[k]) sentOutSelected.delete(k); });
  var allSelected = combined.length>0 && combined.every(function(l){ return sentOutSelected.has(l.kind+':'+l.id); });

  const rows = combined.length===0
    ? '<div class="empty"><div class="empty-icon">&#128231;</div><h3>No leads sent out yet</h3><p>Use "Send to Team" on a saved lead or task to share it with a teammate</p></div>'
    : '<div class="table-container"><div class="table-wrap"><table>'
      +'<thead><tr>'
      +'<th style="width:34px;text-align:center"><input type="checkbox" '+(allSelected?'checked':'')+' onclick="sentOutToggleSelectAll(this.checked)" title="Select all"></th>'
      +'<th>Type</th><th>Property</th><th>Phone</th><th>Offer</th><th>Status</th><th>Score</th><th>Sent To</th><th>Signed By</th><th>Sent On</th><th>Team Follow-Up</th><th>Recipient Follow-Up</th><th style="text-align:center">Delete</th>'
      +'</tr></thead><tbody>'
      + combined.map(l=>`
        <tr onclick="${l.kind==='task'?'openJVDetail('+l.id+')':'openDetail('+l.id+')'}">
          <td style="text-align:center" onclick="event.stopPropagation()"><input type="checkbox" ${sentOutSelected.has(l.kind+':'+l.id)?'checked':''} onclick="sentOutToggleSelect('${l.kind}',${l.id},this.checked)"></td>
          <td>${l.kind==='task'?'<span style="font-size:9px;font-weight:900;color:#0369a1;background:#e0f2fe;border:1px solid #7dd3fc;border-radius:4px;padding:1px 5px">TASK</span>':'<span style="font-size:9px;font-weight:900;color:#dc2626;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;padding:1px 5px">DMV</span>'}</td>
          <td><div class="address-cell">${esc(l.kind==='task'?(l.location||l.name):l.address)||''}</div></td>
          <td><div class="phone-cell">${l.phone?'<a href="#" data-phone="'+l.phone.split('/')[0].trim()+'" data-cid="'+(l.ghlContactId||'')+'" onclick="openGHL(this.dataset.phone,this.dataset.cid,event)" style="color:var(--accent);text-decoration:none;font-weight:600" title="'+(l.ghlContactId?'Open contact in GoHighLevel':'Copy number &amp; open GoHighLevel')+'">'+esc(l.phone.split('/')[0].trim())+' &#8599;</a>':''}</div></td>
          <td><span class="money-val">${formatMoney(l.kind==='task'?l.askingPrice:l.offer)}</span></td>
          <td>${l.kind==='task'?statusBadge(l.jvStatus):statusBadge(l.status)}</td>
          <td>${leadScoreBadgeHTML(l.score)}</td>
          <td style="font-size:12px;color:var(--text2)">${esc(l.sharedWith)||''}</td>
          <td id="signer-${l.kind}-${l.id}" style="font-size:12px">${String(l.agreementStatus||'').toLowerCase()==='accepted'?'<span style="color:#1a7f43;font-weight:600">Signed</span>':'<span style="color:var(--text4)">Awaiting signature</span>'}</td>
          <td style="font-size:12px;color:var(--text3)">${l.sharedAt?new Date(l.sharedAt).toLocaleDateString():''}</td>
          <td>${l.followUpDate?followUpChip(l.followUpDate):'<span style="color:var(--text4);font-size:11px">&#8212;</span>'}</td>
          <td>${l.recipientFollowUpDate?followUpChip(l.recipientFollowUpDate):'<span style="color:var(--text4);font-size:11px">&#8212;</span>'}</td>
          <td style="text-align:center" onclick="event.stopPropagation()"><button onclick="sentOutDeleteOne('${l.kind}',${l.id})" title="Remove from Sent Out (keeps the lead)" style="background:var(--red-bg);border:1px solid #fca5a5;color:var(--red);border-radius:5px;padding:2px 8px;cursor:pointer;font-size:12px">&#128465;</button></td>
        </tr>`).join('')
      +'</tbody></table></div></div>';

  const selCount = sentOutSelected.size;
  const bulkBar = selCount>0
    ? `<button class="btn btn-danger btn-sm" onclick="sentOutDeleteSelected()">&#128465; Delete Selected (${selCount})</button>
       <button class="btn btn-secondary btn-sm" onclick="sentOutClearSelection()">Clear</button>`
    : '';

  document.getElementById('tab-content').innerHTML=`
    <div style="padding:16px 24px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap">
        <div>
          <h2 style="font-size:16px;font-weight:700">&#128231; Sent Out</h2>
          <p style="font-size:12px;color:var(--text3);margin-top:3px">${combined.length} lead${combined.length!==1?'s':''} shared via email &middot; deleting here only removes the Sent Out record, the lead stays in the CRM</p>
        </div>
        <div style="display:flex;gap:6px;align-items:center">${bulkBar}</div>
      </div>
      ${buildRecipientFUHTML()}
      ${rows}
    </div>`;
  hydrateSentOutSigners(combined);
}
// Pull the actual signer name(s) from the acceptance ledger and drop them into the
// "Signed By" cells. Keeps the Sent Out list current even if a recipient signs while
// the CRM is open. Read-only; failures are silent (cells keep their status fallback).
async function hydrateSentOutSigners(list){
  var groups={lead:[],task:[]};
  (list||[]).forEach(function(x){ if(groups[x.kind]) groups[x.kind].push(x.id); });
  for(var kind in groups){
    var ids=groups[kind];
    if(!ids.length) continue;
    try{
      var accs=await sbFetch('lead_agreements?kind=eq.'+kind+'&lead_id=in.('+ids.join(',')+')&order=accepted_at.desc&select=lead_id,first_name,last_name');
      var seen={};
      (accs||[]).forEach(function(r){
        if(seen[r.lead_id]) return;      // rows are newest-first, so keep the first per lead
        seen[r.lead_id]=true;
        var cell=document.getElementById('signer-'+kind+'-'+r.lead_id);
        if(cell){ cell.innerHTML='<span style="color:#1a7f43;font-weight:600">'+esc(((r.first_name||'')+' '+(r.last_name||'')).trim())+'</span>'; }
      });
    }catch(e){}
  }
}
// ===== Sent Out selection + delete =====
// "Delete" here = un-share (set shared=false). The lead/task itself is NEVER removed from the CRM.
var sentOutSelected = new Set();
function sentOutToggleSelect(kind,id,checked){ var k=kind+':'+id; if(checked) sentOutSelected.add(k); else sentOutSelected.delete(k); renderSentOutTab(); }
function sentOutToggleSelectAll(checked){
  var soLeads = leads.filter(function(l){return !l.deleted&&l.shared;});
  var soTasks = jvLeads.filter(function(l){return !l.deleted&&l.shared;});
  sentOutSelected.clear();
  if(checked){ soLeads.forEach(function(l){ sentOutSelected.add('lead:'+l.id); }); soTasks.forEach(function(l){ sentOutSelected.add('task:'+l.id); }); }
  renderSentOutTab();
}
function sentOutClearSelection(){ sentOutSelected.clear(); renderSentOutTab(); }
function unshareRecord(kind,id){
  if(kind==='task'){
    var t = jvLeads.find(function(x){return x.id===id;});
    if(!t) return;
    t.shared=false; t.sharedAt=''; t.sharedWith='';
    saveJV(); saveJVToSupabase(t);
  } else {
    var l = leads.find(function(x){return x.id===id;});
    if(!l) return;
    l.shared=false; l.sharedAt=''; l.sharedWith='';
    localStorage.setItem('crm_leads', JSON.stringify(leads)); saveLeadToSupabase(l);
  }
}
function sentOutDeleteOne(kind,id){
  if(!confirm('Remove this lead from Sent Out?\n\nThis only removes the Sent Out record — the lead stays in your CRM.')) return;
  unshareRecord(kind,id);
  sentOutSelected.delete(kind+':'+id);
  renderSentOutTab();
  showToast('Removed from Sent Out','success');
}
function sentOutDeleteSelected(){
  var n = sentOutSelected.size;
  if(n===0){ showToast('Nothing selected','error'); return; }
  if(!confirm('Delete '+n+' selected record'+(n===1?'':'s')+' from Sent Out?\n\nThis only removes the Sent Out record'+(n===1?'':'s')+' — the lead'+(n===1?'':'s')+' stay in your CRM.')) return;
  sentOutSelected.forEach(function(k){ var parts=k.split(':'); unshareRecord(parts[0], parseInt(parts[1],10)); });
  sentOutSelected.clear();
  renderSentOutTab();
  showToast(n+' removed from Sent Out','success');
}

function getJVStatuses(){
  var s = JSON.parse(localStorage.getItem('crm_jv_statuses')||'null') || ['New','Contacted','Follow Up','Under Contract','Closed','Pass'];
  if(!s.includes('Offer Sent')){ s = s.slice(0,-1).concat('Offer Sent', s.slice(-1)); saveJVStatuses(s); }
  return s;
}
function saveJVStatuses(s){ localStorage.setItem('crm_jv_statuses', JSON.stringify(s)); }
function getJVStatusColors(){
  var c = JSON.parse(localStorage.getItem('crm_jv_status_colors')||'null') || {
    'New':             {bg:'#e0f2fe',color:'#0369a1',border:'#7dd3fc'},
    'Contacted':       {bg:'#fef3c7',color:'#b45309',border:'#fcd34d'},
    'Follow Up':       {bg:'#ede9fe',color:'#7c3aed',border:'#c4b5fd'},
    'Under Contract':  {bg:'#dcfce7',color:'#16a34a',border:'#86efac'},
    'Closed':          {bg:'#d1fae5',color:'#059669',border:'#6ee7b7'},
    'Offer Sent':      {bg:'#dbeafe',color:'#2563eb',border:'#93c5fd'},
    'Pass':            {bg:'#f1f5f9',color:'#475569',border:'#cbd5e1'},
  };
  if(!c['Offer Sent']){ c['Offer Sent']={bg:'#dbeafe',color:'#2563eb',border:'#93c5fd'}; saveJVStatusColors(c); }
  return c;
}
function saveJVStatusColors(c){ localStorage.setItem('crm_jv_status_colors', JSON.stringify(c)); }

function jvStatusBadge(s){
  if(!s) return '<span class="badge badge-empty">&#8212;</span>';
  var c = getJVStatusColors()[s] || {bg:'#f1f5f9',color:'#475569',border:'#cbd5e1'};
  return '<span class="badge" style="background:'+c.bg+';color:'+c.color+';border-color:'+c.border+'">'+s+'</span>';
}
function scoreBadgeHTML(score){
  return score==='Hot' ? '<span class="badge" style="background:#fee2e2;color:#dc2626;border-color:#fca5a5">&#128308; Hot</span>'
    : score==='Warm' ? '<span class="badge" style="background:#fef3c7;color:#b45309;border-color:#fcd34d">&#128993; Warm</span>'
    : score==='Cold' ? '<span class="badge" style="background:#dbeafe;color:#2563eb;border-color:#93c5fd">&#128309; Cold</span>'
    : '<span class="badge" style="background:#f0fdf4;color:#16a34a;border-color:#86efac">&#10003; Qualified</span>';
}
// Same Hot/Warm/Cold styling as scoreBadgeHTML, but shows a plain dash (not "Qualified") when unset —
// used on DMV/Nationwide leads where "Qualified" doesn't make sense as a default.
function leadScoreBadgeHTML(score){
  return score==='Hot' ? '<span class="badge" style="background:#fee2e2;color:#dc2626;border-color:#fca5a5">&#128308; Hot</span>'
    : score==='Warm' ? '<span class="badge" style="background:#fef3c7;color:#b45309;border-color:#fcd34d">&#128993; Warm</span>'
    : score==='Cold' ? '<span class="badge" style="background:#dbeafe;color:#2563eb;border-color:#93c5fd">&#128309; Cold</span>'
    : '<span class="badge badge-empty">&#8212;</span>';
}

var jvScoreFilter = '';
var jvStatusFilter = '';
var jvDateFrom = '';
var jvDateTo = '';
var jvSelectedLeads = new Set();

function renderJVLeadsTab(){
  var statuses = getJVStatuses();
  var jvMk = jvRecentMonth ? mostRecentMonthKey(jvLeads.filter(function(l){return !l.deleted;}),'dateAdded') : '';

  // Apply filters
  var filtered = jvLeads.filter(function(l){
    if(l.deleted) return false;
    if(jvScoreFilter && l.score !== jvScoreFilter) return false;

function jvDeleteSelected(){
  var count=jvSelectedLeads.size;
  if(!count) return;
  if(!confirm('Delete '+count+' selected JV lead'+(count!==1?'s':'')+'?')) return;
  var now=new Date().toISOString();
  var affected=jvLeads.filter(function(l){return jvSelectedLeads.has(l.id);});
  affected.forEach(function(l){ l.deleted=true; l.deletedAt=now; });
  jvSelectedLeads.clear();
  saveJV();
  affected.forEach(function(l){saveJVToSupabase(l);});
  renderJVLeadsTab();
  showToast('Deleted '+count+' JV leads','warning',function(){
    affected.forEach(function(l){ l.deleted=false; l.deletedAt=''; });

    affected.forEach(function(l){saveJVToSupabase(l);});
    showToast('Restored','success');

}

// ---- Find # (skip trace via the "CRM Find Number" browser extension) --------
function crmFindNumber(id){
  var l=jvLeads.find(function(x){return x.id===id;});
  if(!l) return;
  if(!l.location){ showToast('Add an address to this lead first','error'); return; }
  // Tell the extension which lead + address we want a wireless number for.
  window.postMessage({__fn:'CRM_TO_EXT',type:'CRM_FIND_NUMBER',leadId:id,name:l.name||'',address:l.location||''},'*');
  // Open FastPeopleSearch (user gesture). Homepage is safest — the extension fills the form.
  window.open('https://www.fastpeoplesearch.com/','_blank');
  showToast('🌐 Turn ON US VPN (Proton → United States), then Search on the new tab — I\'ll grab the first cell number','success');
}
// Bind the result listener once.
if(!window.__crmFindNumberBound){
  window.__crmFindNumberBound=true;
  window.addEventListener('message',function(e){
    if(!e.data||e.data.__fn!=='EXT_TO_CRM') return;
    if(e.data.type!=='FIND_NUMBER_RESULT') return;
    var l=jvLeads.find(function(x){return x.id===e.data.leadId;});
    if(!l) return;
    if(e.data.found && e.data.phone){
      l.phone=e.data.phone;
      if(!l.activityLog) l.activityLog=[];
      l.activityLog.push({type:'Skip Trace',by:'Find #',at:new Date().toISOString(),note:'Found wireless '+e.data.phone+(e.data.carrier?(' ('+e.data.carrier+')'):'')});
      saveJV();
      var mc=document.getElementById('modal-container');
      if(mc && mc.innerHTML.indexOf('modal-overlay')!==-1) openJVDetail(l.id);
      renderJVLeadsTab && renderJVLeadsTab();
      showToast('📱 Found cell: '+e.data.phone,'success');
      saveJVToSupabase(l);
    } else {
      showToast('No wireless number found — try another match on FastPeopleSearch','warning');
    }
  });
}
async function saveJVDetail(id){
  var l=jvLeads.find(function(x){return x.id===id;});
  if(!l) return;
  var oldFollowUp=l.followUpDate;
  l.jvStatus=document.getElementById('jv-detail-status').value;
  l.followUpDate=document.getElementById('jv-fu-date').value;
  if(l.followUpDate && l.followUpDate!==oldFollowUp){
    if(!l.activityLog) l.activityLog=[];
    l.activityLog.push({type:'Follow-Up Set',by:currentUser.name,at:new Date().toISOString(),note:'Follow-up scheduled for '+l.followUpDate});
  }
  saveJV();renderJVLeadsTab();
  // Same fix as saveEditTask: save locally + close immediately, sync in background.
  showToast('Saved!','success');
  closeModal();
  saveJVToSupabase(l).then(function(ok){
    if(!ok) showToast('Saved on this device — cloud sync failed, it will retry automatically','warning');
  });
}
function saveJVFollowUp(id){
  var date=document.getElementById('jv-fu-date').value;
  var l=jvLeads.find(function(x){return x.id===id;});
  if(!l) return;
  l.followUpDate=date;saveJV();saveJVToSupabase(l);closeModal();renderJVLeadsTab();
  showToast('Follow-up date saved!','success');

function importJVCSV(input){
  var file=input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result;
    function parseCSV(str){
      var rows=[],row=[],field='',inQuote=false;
      for(var i=0;i<str.length;i++){
        var c=str[i];
        if(c==='"'){if(inQuote&&str[i+1]==='"'){field+='"';i++;}else inQuote=!inQuote;}
        else if(c===','&&!inQuote){row.push(field);field='';}
        else if((c==='\n'||c==='\r')&&!inQuote){
          if(c==='\r'&&str[i+1]==='\n')i++;
          row.push(field);field='';
          if(row.some(function(f){return f.trim();}))rows.push(row);
          row=[];
        }else field+=c;
      }
      if(field||row.length){row.push(field);if(row.some(function(f){return f.trim();}))rows.push(row);}
      return rows;
    }
    var parsed=parseCSV(text);
    if(parsed.length<2){showToast('No data found','error');return;}
    var headers=parsed[0].map(function(h){return h.trim().toLowerCase();});
    var imported=0,skipped=0;
    var maxId=jvLeads.length?Math.max.apply(null,jvLeads.map(function(l){return l.id;})):0;
    var existingLinks={};
    jvLeads.forEach(function(l){if(l.fbLink)existingLinks[l.fbLink]=true;});
    for(var i=1;i<parsed.length;i++){
      var vals=parsed[i];
      var row={};
      headers.forEach(function(h,idx){row[h]=vals[idx]?vals[idx].trim():'';});
      var fbLink=row['post_url']||row['facebook post link']||row['facebook link']||row['link']||row['url']||'';
      if(fbLink&&existingLinks[fbLink]){skipped++;continue;}
      var name=row['name']||row['poster_name']||row['agent']||'';
      var phone=row['phone']||row['phone number']||'';
      var notes=row['notes']||row['note']||row['post_text']||'';
      var location=row['location']||row['address']||row['city']||'';
      var score=row['score']||row['rating']||row['category']||'';
      var askingPrice=row['asking price']||row['askingprice']||row['price']||row['offer']||'';
      var arv=row['arv']||'';
      var profitEst=row['profit est']||row['profit']||row['profit_est']||'';
      var group=row['group']||row['source group']||row['source']||'';
      var dateAdded=row['date_scraped']||row['date']||today();
      if(!name&&!phone&&!notes){skipped++;continue;}
      var lead={
        id:++maxId,name:name,phone:phone,score:score||'Qualified',
        notes:notes,fbLink:fbLink,sourceGroup:group,
        location:location,askingPrice:askingPrice,arv:arv,profitEst:profitEst,
        followUpDate:row['follow-up date']||row['follow_up_date']||'',
        jvStatus:'',dateAdded:dateAdded
      };
      jvLeads.push(lead);
      if(fbLink)existingLinks[fbLink]=true;
      saveJVToSupabase(lead);
      imported++;
    }
    saveJV();renderJVLeadsTab();
    var msg='Imported '+imported+' JV leads!';
    if(skipped>0)msg+=' ('+skipped+' skipped)';
    showToast(msg,'success');
    input.value='';
  };
  reader.readAsText(file);
}

async function saveEditTask(id){
  var l = jvLeads.find(function(x){return x.id===id;});

  var addr = document.getElementById('t-location').value.trim();
  var dup = findJVDup(addr, id);

  var oldFollowUp = l.followUpDate;
  l.name = document.getElementById('t-name').value.trim();
  l.phone = document.getElementById('t-phone').value.trim();
  l.location = addr;
  l.askingPrice = document.getElementById('t-askingprice').value.trim();
  l.arv = document.getElementById('t-arv').value.trim();
  l.jvStatus = document.getElementById('t-status').value;
  l.score = document.getElementById('t-score').value;
  l.followUpDate = document.getElementById('t-followup').value;
  l.dateAdded = document.getElementById('t-date').value || today();
  l.notes = document.getElementById('t-notes').value.trim();
  if(l.followUpDate && l.followUpDate!==oldFollowUp){
    if(!l.activityLog) l.activityLog=[];
    l.activityLog.push({type:'Follow-Up Set',by:currentUser.name,at:new Date().toISOString(),note:'Follow-up scheduled for '+l.followUpDate});

    saveAttachments('task', id, existing.concat(newTaskAttachments));
    newTaskAttachments = [];
  }
  saveJV();
  renderJVLeadsTab();
  // Persist locally and close immediately so the change shows right away and never needs a
  // second Save click. Cloud sync runs in the background; pendingSaves (inside saveJVToSupabase)
  // still blocks the 30s auto-refresh poll from stomping this write while it's in flight.
  showToast('Task updated!','success');

  // removing the need for the inline "Save Changes" under Follow-Up.
  openJVDetail(id);
  saveJVToSupabase(l).then(function(ok){
    if(!ok) showToast('Saved on this device — cloud sync failed, it will retry automatically','warning');
  });
}

var newTaskAttachments = [];

function handleNewTaskFiles(input){
  var files = Array.from(input.files);
  if(!files.length) return;
  var pending = files.length;
  files.forEach(function(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var sizeKB = (file.size/1024).toFixed(1);
      var sizeStr = sizeKB > 1024 ? (sizeKB/1024).toFixed(1)+'MB' : sizeKB+'KB';
      newTaskAttachments.push({name: file.name, size: sizeStr, data: e.target.result, addedAt: today()});
      pending--;
      if(pending === 0){
        renderNewTaskAttachments();
        showToast(files.length+' file'+(files.length!==1?'s':'')+' attached!','success');
      }
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderNewTaskAttachments(){
  var list = document.getElementById('task-attachments-list');

function onSearch(v){

  var pagination=filtered.length>PAGE_SIZE?renderPagination(filtered.length):'';

  if(countEl) countEl.textContent=filtered.length+' leads';
  // Update delete filter btn
  var delEl=document.querySelector('.del-filter-btn');
  // Re-render only the dynamic parts below toolbar
  var tableEl=document.querySelector('.table-container')||document.querySelector('.cards-container')||document.querySelector('.empty');
  if(tableEl){
    var wrapper=document.createElement('div');
    wrapper.innerHTML=bulkBar+content2+pagination;
    // Remove old bulk bar, table, pagination
    var parent=tableEl.parentNode;
    // Find and remove bulk bar if exists
    var oldBulk=parent.querySelector('[style*="fff3cd"]');
    if(oldBulk) oldBulk.remove();
    // Remove old pagination
    var oldPag=parent.querySelector('.pagination');
    if(oldPag) oldPag.remove();
    // Replace table
    var newTable=wrapper.querySelector('.table-container')||wrapper.querySelector('.cards-container')||wrapper.querySelector('.empty');
    if(newTable) tableEl.replaceWith(newTable);
    // Add bulk bar before table
    var newBulk=wrapper.querySelector('[style*="fff3cd"]');
    var currentTable=parent.querySelector('.table-container')||parent.querySelector('.cards-container')||parent.querySelector('.empty');
    if(newBulk && currentTable) currentTable.before(newBulk);
    // Add pagination after table
    var newPag=wrapper.querySelector('.pagination');
    if(newPag && currentTable) currentTable.after(newPag);
  } else {
    renderLeadsTab();
  }
  // Update toolbar right count and delete btn
  var toolbarRight=document.querySelector('.toolbar-right');
  if(toolbarRight){
    var span=toolbarRight.querySelector('.result-count');
    if(span) span.textContent=filtered.length+' leads';
    var oldDel=toolbarRight.querySelector('.btn-danger');
    if(oldDel) oldDel.remove();
    if(hasFilter){
      var btn=document.createElement('button');
      btn.className='btn btn-danger btn-sm';
      btn.innerHTML='&#128465; Delete All '+filtered.length;
      btn.onclick=deleteAllFiltered;
      if(span) span.after(btn);
    }
  }
}

// ===== Activity Log & Notification Banner =====
// Tracks manual "Called / Texted / Followed Up / Note" entries per lead, plus auto-entries
// when a Follow-Up date is set. Notification banner shows what's new since the person last checked.
function logActivity(kind, id, type, note){
  var arr = kind==='task' ? jvLeads : leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l) return;
  if(!l.activityLog) l.activityLog=[];
  l.activityLog.push({type:type, by:currentUser.name, at:new Date().toISOString(), note:note||''});
  if(kind==='task'){ saveJV(); saveJVToSupabase(l); }
  else { localStorage.setItem('crm_leads', JSON.stringify(leads)); saveLeadToSupabase(l); }
  var noteInput = document.getElementById(kind==='task'?'jv-activity-note':'lead-activity-note');
  if(noteInput) noteInput.value='';
  if(kind==='task') openJVDetail(id); else { modalLead=l; renderDetailModal(); }
  showToast(type+' logged','success');
}
function deleteActivityEntry(kind, id, index){
  if(!confirm('Remove this log entry?')) return;
  var arr = kind==='task' ? jvLeads : leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l || !l.activityLog) return;
  // index refers to position in the newest-first sorted list shown on screen,
  // so map back to the matching entry in the original (unsorted) array by reference.
  var sorted = l.activityLog.slice().sort(function(a,b){ return new Date(b.at) - new Date(a.at); });
  var target = sorted[index];
  if(!target) return;
  var pos = l.activityLog.indexOf(target);
  if(pos>-1) l.activityLog.splice(pos,1);
  if(kind==='task'){ saveJV(); saveJVToSupabase(l); }
  else { localStorage.setItem('crm_leads', JSON.stringify(leads)); saveLeadToSupabase(l); }
  if(kind==='task') openJVDetail(id); else { modalLead=l; renderDetailModal(); }
  showToast('Log entry removed','success');
}

function downloadAgreementCSV(id, kind){
  fetchAgreements(id, kind).then(function(rows){
    rows = rows || [];
    var cols=['first_name','last_name','email','lead_id','kind','property_address','agreement_version','status','ip','user_agent','accepted_at','revealed_at'];
    var escCsv=function(v){ v=(v==null?'':String(v)); return '"'+v.replace(/"/g,'""')+'"'; };
    var lines=[cols.join(',')];
    rows.forEach(function(r){ lines.push(cols.map(function(c){return escCsv(r[c]);}).join(',')); });
    var blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='agreement_'+kind+'_'+id+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  }).catch(function(){ alert('Could not download the acceptance CSV.'); });
}

let pendingActivityEntries = [];
function computePendingActivity(){
  var entries = [];
  leads.forEach(function(l){
    if(l.deleted) return;
    (l.activityLog||[]).forEach(function(e){
      if(e.at > activityCheckpoint) entries.push({kind:'lead', id:l.id, label:l.address||l.name||'Lead #'+l.id, type:e.type, by:e.by, at:e.at, note:e.note});
    });
  });
  jvLeads.forEach(function(l){
    if(l.deleted) return;
    (l.activityLog||[]).forEach(function(e){
      if(e.at > activityCheckpoint) entries.push({kind:'task', id:l.id, label:l.location||l.name||'Task #'+l.id, type:e.type, by:e.by, at:e.at, note:e.note});
    });
  });
  entries.sort(function(a,b){ return new Date(b.at) - new Date(a.at); });
  pendingActivityEntries = entries;
}

  var deadTasks = jvLeads.filter(function(l){return l.deleted;}).map(function(l){ return Object.assign({kind:'task'}, l); });

        var badge = l.kind==='task' ? '<span style="font-size:9px;font-weight:900;color:#0369a1;background:#e0f2fe;border:1px solid #7dd3fc;border-radius:4px;padding:1px 5px;margin-right:6px">TASK</span>' : '<span style="font-size:9px;font-weight:900;color:#dc2626;background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;padding:1px 5px;margin-right:6px">DMV</span>';

          + '<div>' + badge + '<span style="font-weight:600;font-size:13px">'+esc(label)+'</span><div style="font-size:11px;color:var(--text3);margin-top:2px">Deleted '+when+'</div></div>'
          + '<div style="display:flex;gap:6px"><button class="btn btn-secondary btn-sm" onclick="restoreFromTrash(\''+l.kind+'\','+l.id+')">&#8617; Restore</button><button class="btn btn-danger btn-sm" onclick="permanentlyDelete(\''+l.kind+'\','+l.id+')">Delete Forever</button></div>'
          + '</div>';
      }).join('');
  document.getElementById('modal-container').innerHTML = '<div class="modal-overlay" onclick="overlayClick(event)"><div class="modal" style="max-width:560px"><div class="modal-header"><div class="modal-title">&#128465; Trash</div><button class="modal-close-btn" onclick="closeModal()">&#10005;</button></div><div class="modal-body">'

    + '</div><div class="modal-footer"><button class="btn btn-secondary btn-sm" onclick="closeModal()">Close</button></div></div></div>';

function restoreFromTrash(kind, id){
  if(kind==='task'){
    var l = jvLeads.find(function(x){return x.id===id;});
    if(!l) return;
    l.deleted=false; l.deletedAt='';
    saveJV(); saveJVToSupabase(l);
  } else {
    var l2 = leads.find(function(x){return x.id===id;});
    if(!l2) return;
    l2.deleted=false; l2.deletedAt='';
    save(); saveLeadToSupabase(l2);
  }
  showTrash(); render();
  showToast('Restored','success');
}
function permanentlyDelete(kind, id){
  if(!confirm('Permanently delete this? This truly cannot be undone.')) return;
  if(kind==='task'){
    jvLeads = jvLeads.filter(function(x){return x.id!==id;});
    saveJV(); deleteJVFromSupabase(id);

// STARTUP -- works on Chrome, Safari, Firefox, Edge, any computer
// 1. Show local data instantly (no waiting)
// 2. Sync with Supabase cloud in background
// 3. Re-render with latest cloud data
// 4. Auto-refresh every 30 seconds to catch changes from other users
async function initFullApp() {
  // Step 1: Load local data immediately so UI shows fast
  try {
    var stored = localStorage.getItem('crm_leads');
    if(stored) leads = JSON.parse(stored);
  } catch(e) {}
  if(!leads || leads.length === 0) {
    leads = RAW_DATA.map(function(l){ return Object.assign({},l,{followUpDate:l.followUpDate||'',nationwide:l.nationwide||''}); });
  }
  computePendingActivity();
  render();

  // Step 2: Sync with cloud
  var synced = await loadFromSupabase();
  await loadJVFromSupabase();
  if(synced) { computePendingActivity(); render(); }
  computePendingActivity(); render();

  // Step 3: Auto-refresh every 30 seconds to catch other users' changes
  setInterval(async function() {
    if(pendingSaves > 0) return; // an edit hasn't finished syncing yet -- don't let this poll stomp it
    try {
      var rows = await sbFetch('leads?select=*&order=id.asc&limit=1000');
      if(rows && rows.length > 0) {
        var newLeads = rows.map(fromRow);
        // Only re-render if data actually changed
        if(JSON.stringify(newLeads) !== JSON.stringify(leads)) {
          leads = newLeads;
          localStorage.setItem('crm_leads', JSON.stringify(leads));
          showSyncStatus('synced');
          computePendingActivity();
          render();
        }
      }
    } catch(e) { showSyncStatus('offline'); }
  }, 30000);

  // Step 4: Same 30-second auto-refresh for Tasks
  setInterval(async function() {
    if(pendingSaves > 0) return;
    try {
      var jvRows = await sbFetch('jv_leads?select=*&order=id.asc&limit=1000');
      if(jvRows && jvRows.length > 0) {
        var newJV = jvRows.map(fromJVRow);
        if(JSON.stringify(newJV) !== JSON.stringify(jvLeads)) {
          jvLeads = newJV;
          saveJV();
          computePendingActivity();
          render();
        }
      }
    } catch(e) {}
  }, 30000);
}

// ===== Shared single-lead view =====
// A restricted link (?shared=lead&id=123) that shows ONLY that one lead -- no other tabs,
// no other leads, no login. Recipient can view details/links and adjust Marketing Type,
// Status, Follow-Up Date, and Notes only. Saves go straight to Supabase by that lead's id.
// ---- Agreement gate helpers (recipient side) ----
// The token is proof-of-acceptance for ONE lead. Stored per-lead so a refresh or a
// return visit does not re-prompt, but accepting Lead A never unlocks Lead B.
function agreementToken(kind, id){ try { return localStorage.getItem('agree_'+kind+'_'+id)||''; } catch(e){ return ''; } }
function setAgreementToken(kind, id, token){ try { localStorage.setItem('agree_'+kind+'_'+id, token); } catch(e){} }

async function agreementCall(body){
  var r = await fetch(AGREEMENT_FN_URL, {
    method:'POST',
    headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  var txt = await r.text();
  var data = txt ? JSON.parse(txt) : {};
  if(!r.ok) throw new Error((data && data.error) || ('HTTP '+r.status));
  return data;
}
function agreementNotFound(){
  document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;color:var(--text3)"><h2>Lead not found</h2><p>This link may be out of date. Please ask for a new one.</p></div>';
}
// Recipient (anonymous shared-link) write path. Routes through the service-role edge
// function gated on this lead's acceptance token, so it keeps working after anon write
// access to leads/jv_leads is locked down. Only whitelisted columns are applied server-side.
async function recipientEdgeSave(kind, id, patch){
  // Signed-in recipient (portal): save via portal_save with their JWT, no acceptance token needed.
  if(sharedViewMode==='portal'){
    await authRefreshIfNeeded();
    var portalFetch = function(){ return fetch(AGREEMENT_FN_URL, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+sbAuthToken(), 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'portal_save', kind:kind, leadId:id, patch:patch })
    }); };
    var r = await portalFetch();
    if(r.status===401 && await authForceRefresh()){ r = await portalFetch(); }
    if(r.status===401){ bounceToLogin(); throw new Error('Your session expired — please sign in again.'); }
    var data = await r.json().catch(function(){ return {}; });
    if(!r.ok || data.error) throw new Error(data.error || ('HTTP '+r.status));
    applyRecipientPatchLocal(kind, id, patch); // keep in-memory record in sync for the dashboard/list
    return data;
  }
  // Anonymous emailed link: token-gated recipient_save.
  return await agreementCall({ action:'recipient_save', kind:kind, leadId:id, token: agreementToken(kind, id), patch: patch });
}
// Map a saved snake_case patch back onto the in-memory (camelCase) lead/task so the portal
// dashboard and list reflect edits without a full reload.
function applyRecipientPatchLocal(kind, id, patch){
  var arr = kind==='task'?jvLeads:leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l) return;
  var map = { marketing_type:'marketingType', status:'status', score:'score',
    recipient_follow_up_date:'recipientFollowUpDate', recipient_notes:'recipientNotes',
    activity_log:'activityLog', jv_status:'jvStatus', beds:'beds', baths:'baths', sqft:'sqft',
    updated_by:'updatedBy', updated_at:'updatedAt',
    needs_review:'needsReview', review_sent_by:'reviewSentBy', review_sent_at:'reviewSentAt', review_note:'reviewNote' };
  for(var k in patch){ if(map[k]) l[map[k]] = patch[k]; }
}

// Access-key login screen (only shown when AUTH_ENABLED and no valid session).
// One field: the person enters just their access key — no email.
function renderAuthLogin(errMsg){
  document.getElementById('app').innerHTML = '';
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay">
      <div class="user-modal" style="max-width:380px">
        <div style="font-size:36px;margin-bottom:6px">&#127968;</div>
        <h2 style="margin-bottom:2px">DMV Agent Outreach CRM</h2>
        <p style="margin-bottom:16px">Enter your access key</p>
        <div style="text-align:left">
          <label class="form-label">Access Key</label>
          <input id="auth-key" class="form-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. K7PQ9M2XR4TJ" style="margin-bottom:6px;letter-spacing:1px;font-family:monospace" onkeydown="if(event.key==='Enter')doAuthLogin()">
          <div id="auth-err" style="color:var(--red,#dc2626);font-size:12px;min-height:16px;margin-bottom:8px">${errMsg?esc(errMsg):''}</div>
          <button id="auth-btn" class="btn btn-primary" style="width:100%" onclick="doAuthLogin()">Sign In</button>
        </div>
        <p style="font-size:11px;color:var(--text3);margin-top:14px">Your admin gives you an access key. Lost it? Ask your admin for a new one.</p>
      </div>
    </div>`;
  setTimeout(function(){ var e=document.getElementById('auth-key'); if(e) e.focus(); }, 50);
}
async function doAuthLogin(){
  var key = (document.getElementById('auth-key')||{}).value || '';
  var btn = document.getElementById('auth-btn'); var err = document.getElementById('auth-err');
  if(err) err.textContent='';
  if(!key.trim()){ if(err) err.textContent='Enter your access key.'; return; }
  if(btn){ btn.disabled=true; btn.textContent='Signing in…'; }
  try {
    var profile = await authKeyLogin(key);
    if(!profile){ throw new Error('Your account has no profile. Ask your admin to set it up.'); }
    if(profile.disabled){ clearAuth(); throw new Error('This account has been disabled.'); }
    document.getElementById('modal-container').innerHTML='';
    routeByRole();
  } catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Sign In'; }
    if(err) err.textContent = e.message || 'Sign in failed.';
  }
}
// After a valid session is established, send the user to the right experience.
function routeByRole(){
  if(!authProfile){ renderAuthLogin(); return; }
  if(authProfile.role==='recipient'){
    initRecipientPortal();
  } else {
    // admin or team -> full CRM. Bridge to the legacy currentUser the rest of the app expects.
    var nm = authProfile.name || authProfile.email || 'User';
    var initials = nm.trim().split(/\s+/).map(function(w){return w[0]||'';}).slice(0,2).join('').toUpperCase() || 'ME';
    currentUser = { id:authProfile.id, name:nm, role:(authProfile.role==='admin'?'Admin':'Team'), email:authProfile.email, color:(authProfile.role==='admin'?'#1e40af':'#16a34a'), initials:initials };
    localStorage.setItem('crm_user', JSON.stringify(currentUser));
    initFullApp();
  }
}

// ---- Recipient portal: a logged-in recipient sees ONLY the leads in their scope ----
function recipientCanSeeLead(l){
  if(!authProfile) return false;
  if(l.deleted) return false; // cascade: deleted leads disappear from the recipient view too
  var email = (authProfile.email||'').trim().toLowerCase();
  if(authProfile.scope_nationwide && l.nationwide==='Yes') return true;
  if(authProfile.scope_dmv && l.nationwide!=='Yes') return true;
  // Emailed scope: any lead already sent to this recipient's email (past or new) shows up.
  if(authProfile.scope_emailed && (l.sharedWith||'').trim().toLowerCase()===email && email) return true;
  return false;
}
async function initRecipientPortal(){
  document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;color:var(--text3)">Loading your leads…</div>';
  await authRefreshIfNeeded();
  // Load leads + tasks the recipient is allowed to see (RLS will also enforce this once locked down).
  try {
    var rows = await sbFetch('leads?select=*&order=id.desc&limit=1000');
    leads = (rows||[]).map(fromRow);
  } catch(e){ leads = []; }
  try {
    var jvRows = await sbFetch('jv_leads?select=*&order=id.desc&limit=1000');
    jvLeads = (jvRows||[]).map(fromJVRow);
  } catch(e){ jvLeads = []; }
  renderRecipientPortal();
  // gentle auto-refresh
  if(!window.__recipPoll){
    window.__recipPoll = setInterval(async function(){
      // Only refresh while the recipient is on the LIST view. If a lead is open (portalView
      // === 'detail') we must NOT refetch/re-render — doing so would replace #app, closing the
      // open lead and discarding beds/baths/notes typed but not yet saved. Also skip while a
      // save is in flight so the poll can't stomp an edit mid-write.
      if(portalView !== 'list') return;
      if(typeof pendingSaves !== 'undefined' && pendingSaves > 0) return;
      try {
        await authRefreshIfNeeded();
        // Bail again after the await — the user may have opened a lead while it was resolving.
        if(portalView !== 'list') return;
        var rows = await sbFetch('leads?select=*&order=id.desc&limit=1000');
        var jvRows = await sbFetch('jv_leads?select=*&order=id.desc&limit=1000');
        if(portalView !== 'list') return;
        var newLeads = (rows||[]).map(fromRow);
        var newJV = (jvRows||[]).map(fromJVRow);
        // Only re-render if something actually changed (avoids flicker / lost scroll position).
        var changed = JSON.stringify(newLeads) !== JSON.stringify(leads)
                   || JSON.stringify(newJV) !== JSON.stringify(jvLeads);
        leads = newLeads;
        jvLeads = newJV;
        if(changed) renderRecipientPortal();
      } catch(e){}
    }, 30000);
  }
}
function recipientScopeLabel(){
  var parts=[];
  if(authProfile.scope_dmv) parts.push('DMV leads');
  if(authProfile.scope_nationwide) parts.push('Nationwide leads');
  if(authProfile.scope_emailed) parts.push('Leads emailed to you');
  return parts.length?parts.join(' · '):'No leads assigned yet';
}
// The set of leads/tasks this signed-in recipient may see.
function recipientMyLeads(){ return leads.filter(recipientCanSeeLead); }
function recipientMyTasks(){
  var email = (authProfile.email||'').trim().toLowerCase();
  return jvLeads.filter(function(t){
    if(t.deleted) return false;
    if(authProfile.scope_emailed && email && (t.sharedWith||'').trim().toLowerCase()===email) return true;
    return false; // tasks are only surfaced via the emailed scope
  });
}
// Recipient's follow-up dashboard: their OWN follow-up dates (recipientFollowUpDate),
// grouped by urgency, each item clickable into the full lead detail.
function buildPortalFUHTML(mine, myTasks){
  var items=[];
  mine.forEach(function(l){ if(l.recipientFollowUpDate && leadAgreementAccepted(l)) items.push({lead:l, kind:'lead', date:l.recipientFollowUpDate}); });
  myTasks.forEach(function(l){ if(l.recipientFollowUpDate && leadAgreementAccepted(l)) items.push({lead:l, kind:'task', date:l.recipientFollowUpDate}); });
  if(items.length===0) return '';
  items.sort(function(a,b){ return a.date>b.date?1:-1; });
  var overdue=items.filter(function(x){return getFUStatus(x.date)==='overdue';});
  var dueToday=items.filter(function(x){return getFUStatus(x.date)==='today';});
  var soon=items.filter(function(x){return getFUStatus(x.date)==='soon';});
  var future=items.filter(function(x){return getFUStatus(x.date)==='future';});
  function fuItem(x){
    var l=x.lead, d=daysDiff(x.date);
    var lbl = d<0 ? Math.abs(d)+'d overdue' : d===0 ? 'Today' : d===1 ? 'Tomorrow' : 'In '+d+'d';
    var title = (x.kind==='task'?(l.location||l.name):l.address) || l.name || '&#8212;';
    var badge = l.score?leadScoreBadgeHTML(l.score):'';
    return '<div class="followup-item" onclick="openPortalLead(\''+x.kind+'\','+l.id+')" style="cursor:pointer">'
      + '<div class="followup-item-addr" style="margin:0 0 3px">'+esc(title)+'</div>'
      + '<div class="followup-item-meta">'+badge+'</div>'
      + '<div class="followup-item-date">'+x.date+' &middot; '+lbl+'</div>'
      + '</div>';
  }
  function fuCard(title, arr, hColor, hBg, icon){
    var rows = arr.length===0 ? '<div class="followup-empty">None</div>' : arr.map(fuItem).join('');
    return '<div class="followup-group"><div class="followup-group-header" style="background:'+hBg+';color:'+hColor+'"><span>'+icon+' '+title+'</span><span style="background:'+hColor+';color:#fff;border-radius:10px;padding:1px 8px;font-size:11px">'+arr.length+'</span></div><div style="max-height:300px;overflow-y:auto">'+rows+'</div></div>';
  }
  var futureRows = future.length===0 ? '<div class="followup-empty">No upcoming follow-ups</div>' : future.map(fuItem).join('');
  return '<div class="followup-container" style="padding:0;margin-bottom:22px">'
    + '<div style="margin-bottom:10px"><h3 style="font-size:14px;font-weight:700">&#128197; Your Follow-Up Dashboard</h3>'
    + '<p style="font-size:12px;color:var(--text3);margin-top:2px">Today is '+today()+' &middot; '+items.length+' scheduled</p></div>'
    + '<div class="followup-grid">'
    + fuCard('Overdue', overdue, '#dc2626', '#fee2e2', '&#128308;')
    + fuCard('Due Today', dueToday, '#b45309', '#fef3c7', '&#128993;')
    + fuCard('Next 3 Days', soon, '#0d9488', '#f0fdfa', '&#128994;')
    + '</div>'
    + '<div class="followup-group" style="margin-top:14px"><div class="followup-group-header" style="background:var(--surface3);color:var(--text2)"><span>&#128198; All Upcoming</span><span style="background:var(--text3);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px">'+future.length+'</span></div><div style="max-height:360px;overflow-y:auto">'+futureRows+'</div></div>'
    + '</div>';
}

    }

    var pd = [];

    var rfu = l.recipientFollowUpDate ? followUpChip(l.recipientFollowUpDate) : '<span style="color:var(--text4);font-size:12px">not set</span>';
    return `<div onclick="openPortalLead('${kind}',${l.id})" style="cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--surface,#fff)" onmouseover="this.style.boxShadow='var(--shadow-md)'" onmouseout="this.style.boxShadow='none'">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
        <div style="font-weight:700;font-size:14px">${esc(addr)}</div>

        ${l.arv?'<span>ARV <b style="color:var(--green)">'+formatMoney(l.arv)+'</b></span>':''}

      </div>

  }
  var body;
  if(mine.length===0 && myTasks.length===0){
    body = '<div class="empty" style="padding:60px;text-align:center;color:var(--text3)"><div style="font-size:40px">&#128237;</div><h3>No leads yet</h3><p>When your team assigns leads to you, they will appear here.</p></div>';
  } else {
    body = '<div style="font-size:13px;font-weight:700;margin-bottom:10px">Your Leads (' + (mine.length+myTasks.length) + ') &middot; <span style="font-weight:400;color:var(--text3)">tap any lead to view details &amp; set your follow-up</span></div>'
      + mine.map(function(l){return row('lead',l);}).join('') + myTasks.map(function(t){return row('task',t);}).join('');
  }
  document.getElementById('app').innerHTML = header + '<div style="max-width:960px;margin:0 auto;padding:18px 16px">' + buildPortalFUHTML(mine, myTasks) + body + '</div>';

// Has this lead's Non-Circumvention Agreement been accepted (signed)?
function leadAgreementAccepted(l){ return String((l&&l.agreementStatus)||'').toLowerCase()==='accepted'; }
// Open a lead for a signed-in recipient. If the agreement isn't signed yet, show the SAME
// agreement gate the emailed link uses (no seller data revealed until they agree). Once signed,
// reuse the rich shared detail view; saves route through portal_save via recipientEdgeSave.
function openPortalLead(kind, id){
  var arr = kind==='task'?jvLeads:leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l) return;
  sharedViewMode = 'portal';
  portalView = 'detail'; // lead is open — freeze the poll so it can't close it or lose input
  window.scrollTo(0,0);
  if(!leadAgreementAccepted(l)){ renderAgreementGate(id, kind); return; }
  if(kind==='task') renderSharedTaskView(l); else renderSharedLeadView(l);
}
async function recipientSetFollowUp(kind, id, val){
  var arr = kind==='task'?jvLeads:leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l) return;
  l.recipientFollowUpDate = val;
  // Reuse the same recipient-write path the shared link uses (routes to edge fn once rerouted).
  await recipientWrite(kind, id, { recipient_follow_up_date: val });
  showToast('Follow-up saved','success');
}
async function recipientAddNote(kind, id){
  var el = document.getElementById('recip-note-'+kind+'-'+id);
  var txt = el && el.value.trim();
  if(!txt) return;
  var arr = kind==='task'?jvLeads:leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l) return;
  if(!l.recipientNotes) l.recipientNotes = [];
  l.recipientNotes.push({ text:txt, by:(authProfile.name||authProfile.email), at:new Date().toISOString() });
  await recipientWrite(kind, id, { recipient_notes: l.recipientNotes });
  if(el) el.value='';
  renderRecipientPortal();
}
async function recipientSaveDetails(kind, id){
  var arr = kind==='task'?jvLeads:leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l) return;
  var beds = (document.getElementById('recip-beds-'+kind+'-'+id)||{}).value || '';
  var baths = (document.getElementById('recip-baths-'+kind+'-'+id)||{}).value || '';
  var sqft = (document.getElementById('recip-sqft-'+kind+'-'+id)||{}).value || '';
  l.beds = beds.trim(); l.baths = baths.trim(); l.sqft = sqft.trim();
  await recipientWrite(kind, id, { beds: l.beds, baths: l.baths, sqft: l.sqft });
  showToast('Property details saved','success');
}
// Central recipient-portal write helper. Routes through the lead-agreement edge function's
// `portal_save` action, which verifies the recipient's session, confirms the lead is in THEIR
// scope, and applies only the two portal-editable fields (follow-up + notes). This keeps the
// portal working after leads/jv_leads writes are locked down — recipients never write directly.
async function recipientWrite(kind, id, patch){
  try {
    await authRefreshIfNeeded();
    var r = await fetch(AGREEMENT_FN_URL, {
      method:'POST',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+sbAuthToken(), 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'portal_save', kind:kind, leadId:id, patch:patch })
    });
    var data = await r.json().catch(function(){ return {}; });
    if(!r.ok || data.error){ throw new Error(data.error || ('HTTP '+r.status)); }
  } catch(e){ showToast('Could not save — ' + (e.message||'check your connection'),'error'); }
}

function mtCopyKey(key){
  try { navigator.clipboard.writeText(key); showToast('Access key copied','success'); }
  catch(e){ showToast('Copy failed — key is '+key,'error'); }
}
async function mtCreate(){
  var err = document.getElementById('mt-err'); if(err) err.textContent='';
  var body = {
    action:'create',
    name:(document.getElementById('mt-name')||{}).value||'',
    email:(document.getElementById('mt-email')||{}).value||'',
    access_key:(document.getElementById('mt-key')||{}).value.trim()||'',
    role:(document.getElementById('mt-role')||{}).value||'recipient',
    scope_dmv: !!(document.getElementById('mt-dmv')||{}).checked,
    scope_nationwide: !!(document.getElementById('mt-nw')||{}).checked,
    scope_emailed: !!(document.getElementById('mt-emailed')||{}).checked
  };
  var newName = body.name, newEmail = body.email;
  try {
    var res = await adminUsersCall(body);
    var issuedKey = (res && res.access_key) ? res.access_key : body.access_key;
    ['mt-name','mt-email','mt-key'].forEach(function(id){ var e=document.getElementById(id); if(e) e.value=''; });
    await mtRefresh();
    if(res && res.access_key){ mtShowKey('Account created', res.access_key); }
    else { showToast('Account created','success'); }
    // Email the new person their login the same way leads are sent (opens a mail draft).
    if(newEmail && issuedKey){ emailLoginInvite(newName, newEmail, issuedKey); }
  } catch(e){ if(err) err.textContent = e.message; }
}
// Draft a "your account is ready" email (login URL + access key) to a newly created user,
// using the same mailto: mechanism as Send-to-Team lead emails.
function emailLoginInvite(name, email, key){
  var url = GITHUB_PAGES_URL;
  var sender = (currentUser && currentUser.name) || 'M-Estate Team';
  var subject = 'Your DMV Agent Outreach CRM login';
  var bodyLines = [
    'Hi ' + (name || 'there') + ',',
    '',
    'Your account for the DMV Agent Outreach CRM has been created.',
    '',
    'Log in here: ' + url,
    'Your access key: ' + key,
    '',
    'Just enter your access key on the login screen — no email or password needed. Keep this key private.',
    '',
    '— ' + sender
  ];
  var mailto = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(bodyLines.join('\n'));
  window.location.href = mailto;
  showToast('Login email drafted to ' + email + ' — check your mail app', 'success');
}

// Sanitize rich-text HTML from the deal form (Bold/italic/underline + bulleted/numbered lists).
// Keeps ONLY a small allow-list of tags, drops all attributes, unwraps everything else.
// Plain-text legacy values (no tags) render with newlines as <br>.
function mfSanitize(html){
  if(html==null) return '';
  html=String(html);
  if(html.indexOf('<')<0) return esc(html).replace(/\n/g,'<br>');
  var ALLOW={B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,BR:1,P:1};
  var tmp=document.createElement('div'); tmp.innerHTML=html;
  function clean(node){
    var out='',kids=node.childNodes,i,n;
    for(i=0;i<kids.length;i++){
      n=kids[i];
      if(n.nodeType===3){ out+=esc(n.nodeValue); continue; }
      if(n.nodeType!==1) continue;
      var tag=n.tagName;
      if(tag==='SCRIPT'||tag==='STYLE'){ continue; } // drop code/style entirely
      if(tag==='BR'){ out+='<br>'; continue; }
      if(ALLOW[tag]){ var t=tag.toLowerCase(); out+='<'+t+'>'+clean(n)+'</'+t+'>'; }
      else if(tag==='DIV'){ var inner=clean(n); out+=inner?('<p>'+inner+'</p>'):''; } // contenteditable line = paragraph
      else { out+=clean(n); } // unwrap unknown tags, keep their text
    }
    return out;
  }
  var res=clean(tmp);
  // Drop empty paragraphs (only whitespace/<br>/&nbsp;) so stray blank lines from the
  // rich-text editor never render as gaps; also trim leading/trailing line breaks.
  res=res.replace(/<p>(?:\s|<br\s*\/?>|&nbsp;)*<\/p>/gi,'')
         .replace(/^(?:\s|<br\s*\/?>|&nbsp;)+/i,'')
         .replace(/(?:\s|<br\s*\/?>|&nbsp;)+$/i,'');
  return res;
}
// True if the sanitized HTML has any visible text (so empty editors don't render a blank card).
function mfHas(html){ return mfSanitize(html).replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim().length>0; }

  var sharedId = params.get('id');
  if (sharedKind === 'lead' && sharedId) { initSharedLeadView(parseInt(sharedId, 10)); return; }
  if (sharedKind === 'task' && sharedId) { initSharedTaskView(parseInt(sharedId, 10)); return; }
  var sharedToken = params.get('token');
  if (sharedKind === 'property' && sharedToken) { initSharedPropertyByToken(sharedToken); return; }
  if (sharedKind === 'property' && sharedId) { initSharedPropertyView(parseInt(sharedId, 10)); return; }

  if (!AUTH_ENABLED) { initFullApp(); return; }

  // Auth on: require a valid session.
  var ok = await authRefreshIfNeeded();
  if(ok && authSession){
    try { await loadAuthProfile(); } catch(e){}
    if(authProfile && !authProfile.disabled){ routeByRole(); return; }
  }
  clearAuth();
  renderAuthLogin();
}
bootApp();
</script>
</body>
</html>
