function mtCopyKey(key){
  try { navigator.clipboard.writeText(key); showToast('Access key copied','success'); }
  catch(e){ showToast('Copy failed — key is '+key,'error'); }
}
async function mtCreate(){
  var err = document.getElementById('mt-err'); if(err) err.textContent='';
  var body = {
    action:'create',
    name:(document.getElementById('mt-name')||{}).value||'',
    email:(document.getElementById('mt-email')||{}).value||'',
    access_key:(document.getElementById('mt-key')||{}).value.trim()||'',
    role:(document.getElementById('mt-role')||{}).value||'recipient',
    scope_dmv: !!(document.getElementById('mt-dmv')||{}).checked,
    scope_nationwide: !!(document.getElementById('mt-nw')||{}).checked,
    scope_emailed: !!(document.getElementById('mt-emailed')||{}).checked
  };
  var newName = body.name, newEmail = body.email;
  try {
    var res = await adminUsersCall(body);
    var issuedKey = (res && res.access_key) ? res.access_key : body.access_key;
    ['mt-name','mt-email','mt-key'].forEach(function(id){ var e=document.getElementById(id); if(e) e.value=''; });
    await mtRefresh();
    if(res && res.access_key){ mtShowKey('Account created', res.access_key); }
    else { showToast('Account created','success'); }
    // Email the new person their login the same way leads are sent (opens a mail draft).
    if(newEmail && issuedKey){ emailLoginInvite(newName, newEmail, issuedKey); }
  } catch(e){ if(err) err.textContent = e.message; }
}
// Draft a "your account is ready" email (login URL + access key) to a newly created user,
// using the same mailto: mechanism as Send-to-Team lead emails.
function emailLoginInvite(name, email, key){
  var url = GITHUB_PAGES_URL;
  var sender = (currentUser && currentUser.name) || 'M-Estate Team';
  var subject = 'Your DMV Agent Outreach CRM login';
  var bodyLines = [
    'Hi ' + (name || 'there') + ',',
    '',
    'Your account for the DMV Agent Outreach CRM has been created.',
    '',
    'Log in here: ' + url,
    'Your access key: ' + key,
    '',
    'Just enter your access key on the login screen — no email or password needed. Keep this key private.',
    '',
    '— ' + sender
  ];
  var mailto = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(bodyLines.join('\n'));
  window.location.href = mailto;
  showToast('Login email drafted to ' + email + ' — check your mail app', 'success');
}
// Prominently show a newly generated key so the admin can copy it before it scrolls away.
function mtShowKey(title, key){
  var box = document.getElementById('mt-err');
  if(box){
    box.style.color = 'var(--green,#16a34a)';
    box.innerHTML = title + ' — access key: <b style="font-family:monospace;font-size:13px">'+esc(key)+'</b> '
      + '<button class="btn btn-secondary btn-sm" onclick="mtCopyKey(\''+esc(key)+'\')">Copy</button>';

}

async function mtResetKey(id){

    await mtRefresh();
    if(res && res.access_key){ mtShowKey('New key generated', res.access_key); }
  } catch(e){ showToast(e.message,'error'); }

async function mtDelete(id, email){

  try { await adminUsersCall({action:'delete', id:id}); await mtRefresh(); showToast('Account deleted — their login is revoked','success'); }
  catch(e){ showToast(e.message,'error'); }
}

function mtEditToggleScope(){

async function mtSaveEdit(id){
  var err=document.getElementById('mte-err'); if(err) err.textContent='';
  var role=(document.getElementById('mte-role')||{}).value||'recipient';
  var body={ action:'update', id:id,
    name:(document.getElementById('mte-name')||{}).value||'',
    email:((document.getElementById('mte-email')||{}).value||'').trim(),
    role:role };
  if(!body.email){ if(err) err.textContent='Email cannot be blank.'; return; }
  // Scope only applies to recipients; leave team/admin scope untouched.
  if(role==='recipient'){
    body.scope_dmv = !!(document.getElementById('mte-dmv')||{}).checked;
    body.scope_nationwide = !!(document.getElementById('mte-nw')||{}).checked;
    body.scope_emailed = !!(document.getElementById('mte-emailed')||{}).checked;
  }
  try { await adminUsersCall(body); await mtRefresh(); showToast('Account updated','success'); }
  catch(e){ if(err) err.textContent = e.message; }
}

// ---- Public shared PROPERTY page (?shared=property&id=) — no login, reads crm_properties by id ----

    var r = await fetch(SUPABASE_URL+'/rest/v1/'+PROP_PATH+'?id=eq.'+id+'&select=*', {
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }

    if(!rows || !rows.length){ document.getElementById('app').innerHTML='<div style="padding:60px;text-align:center;color:var(--text3)"><h2>Deal not found</h2><p>This link may be out of date. Ask for a new one.</p></div>'; return; }

  }catch(e){ document.getElementById('app').innerHTML='<div style="padding:60px;text-align:center;color:var(--text3)"><h2>Could not load</h2><p>Please try again.</p></div>'; }
}
function renderSharedPropertyView(p){

    : '';

    '<div class="pp-page">'

      + '<div class="pp-card">'

        + (folder?'<div style="margin-top:16px">'+folder+'</div>':'')
        + '<div class="pp-cta">Interested? Reply to the text/email you received for numbers &amp; access. Serious cash buyers only.</div>'
      + '</div>'
      + '<div class="pp-foot">M-Estate · This deal is shared for buyer review and is subject to availability.</div>'
    + '</div></div>';
}

async function bootApp(){
  var params = new URLSearchParams(window.location.search);
  var sharedKind = params.get('shared');
  var sharedId = params.get('id');
  if (sharedKind === 'lead' && sharedId) { initSharedLeadView(parseInt(sharedId, 10)); return; }
  if (sharedKind === 'task' && sharedId) { initSharedTaskView(parseInt(sharedId, 10)); return; }
  if (sharedKind === 'property' && sharedId) { initSharedPropertyView(parseInt(sharedId, 10)); return; }

  if (!AUTH_ENABLED) { initFullApp(); return; }

  // Auth on: require a valid session.
  var ok = await authRefreshIfNeeded();
  if(ok && authSession){
    try { await loadAuthProfile(); } catch(e){}
    if(authProfile && !authProfile.disabled){ routeByRole(); return; }
  }
  clearAuth();
  renderAuthLogin();
}
bootApp();
