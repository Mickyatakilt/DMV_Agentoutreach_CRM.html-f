function leAutoRegion(){
  var rEl=document.getElementById('le-region'); if(!rEl || rEl.value.trim()) return;
  var g=ltInferRegion(document.getElementById('le-name').value); if(g) rEl.value=g;
}
function leReadForm(){
  var added=document.getElementById('le-added').value||'';
  return {
    name:(document.getElementById('le-name').value||'').trim(),
    period:ltMonthLabel(added),
    region:(document.getElementById('le-region').value||'').trim().toUpperCase(),
    amount:(document.getElementById('le-amount').value||'').trim(),
    category:document.getElementById('le-cat').value,
    link:(document.getElementById('le-link').value||'').trim(),
    ghlLink:(document.getElementById('le-ghl').value||'').trim(),
    ghlTag:(document.getElementById('le-ghltag').value||'').trim(),
    dueDate:document.getElementById('le-due').value||'',
    dateAdded:added,
    notes:(document.getElementById('le-notes').value||'').trim()
  };
}
async function saveListEntry(id){
  var data=leReadForm();
  if(!data.name){ showToast('List name is required','error'); return; }
  if(id===null||id===undefined){
    try {
      var row=await crmListInsert(Object.assign({lastTexted:'',touches:[]},data));
      if(row) crmLists.push(row);
      showToast('List added','success');
    } catch(e){ showToast('Could not save list — try again','error'); return; }
  } else {
    var l=crmListById(id); if(!l){ showToast('List not found','error'); return; }
    Object.assign(l,data);
    try { await crmListUpdate(l); showToast('List updated','success'); }
    catch(e){ showToast('Saved locally, cloud sync failed — Refresh and retry','error'); }
  }
  closeModal(); renderLists();
}
function deleteListEntry(id){
  var l=crmListById(id); if(!l) return;
  closeModal();
  deleteWithUndo({
    label:'List deleted',
    removeMem:function(){ crmLists=(crmLists||[]).filter(function(x){ return +x.id!==+id; }); ltSel.delete(+id); ltExpanded.delete(+id); },
    restoreMem:function(){ crmLists=(crmLists||[]).concat([l]); },
    dbDelete:function(){ return crmListDeleteDb(id).then(function(){ return crmListContactsDeleteForList(id); }); },
    reRender:function(){ if(activeSection==='lists') renderLists(); }
  });
}

// ---- Touches ----
async function addListTouch(id){
  var l=crmListById(id); if(!l) return;
  var d=document.getElementById('lt-touch-date').value||'';
  var note=(document.getElementById('lt-touch-note').value||'').trim();
  if(!note){ showToast('Add a short note (e.g. "Texted 800")','error'); return; }
  l.touches=l.touches||[]; l.touches.push({date:d,note:note});
  if(d && (!l.lastTexted || d>l.lastTexted)) l.lastTexted=d;
  openListDetail(id); renderListsAreaIfVisible();
  try { await crmListUpdate(l); showToast('Touch logged','success'); }
  catch(e){ showToast('Cloud sync failed — Refresh','error'); }
}
async function removeListTouch(id,idx){
  var l=crmListById(id); if(!l||!l.touches) return;
  l.touches.splice(idx,1);
  l.lastTexted='';
  var ds=l.touches.map(function(t){return t.date;}).filter(Boolean).sort();
  if(ds.length) l.lastTexted=ds[ds.length-1];
  openListDetail(id); renderListsAreaIfVisible();
  try { await crmListUpdate(l); } catch(e){ showToast('Cloud sync failed — Refresh','error'); }
}
async function logListText(id){
  var l=crmListById(id); if(!l) return;
  l.touches=l.touches||[]; l.touches.push({date:today(),note:'Texted all'});
  l.lastTexted=today();
  renderLists();
  try { await crmListUpdate(l); showToast('Logged a text round for "'+l.name+'"','success'); }
  catch(e){ showToast('Cloud sync failed — Refresh','error'); }
}
function renderListsAreaIfVisible(){ if(document.getElementById('lt-list-area')) ltRenderListArea(); }

// ---- CSV import / export ----
function ltParseCSV(text){
  var rows=[],cur=[],val='',inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ val+='"'; i++; } else inQ=false; }
      else val+=c;
    } else {
      if(c==='"') inQ=true;
      else if(c===','){ cur.push(val); val=''; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; cur.push(val); rows.push(cur); cur=[]; val=''; }
      else val+=c;
    }
  }
  if(val!==''||cur.length){ cur.push(val); rows.push(cur); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==''; }); });
}

// Detect which columns hold name/first/last/phone/email; returns {idx, hasHeader}.
function ltDetectContactCols(rows){
  var first=rows[0].map(function(x){return String(x).trim().toLowerCase();});
  var map={first:['first name','first','fname','firstname','given name'],last:['last name','last','lname','lastname','surname'],
    name:['name','full name','contact','contact name','fullname'],
    phone:['phone','phone number','phone1','mobile','cell','cell phone','number','telephone','tel'],
    email:['email','email address','e-mail']};
  var idx={}; var hasHeader=false;
  first.forEach(function(h,i){
    Object.keys(map).forEach(function(k){ if(idx[k]==null && map[k].indexOf(h)>=0){ idx[k]=i; hasHeader=true; } });
  });
  return {idx:idx,hasHeader:hasHeader,header:first};
}
function ltBuildContacts(rows){
  if(!rows.length) return [];
  var d=ltDetectContactCols(rows), idx=d.idx, header=d.header;
  var body=d.hasHeader?rows.slice(1):rows;
  // Fallback when no header: guess col0=name/phone by content.
  if(!d.hasHeader){
    var c0=rows[0][0]||'', isPhone0=/\d{3}.*\d{4}/.test(String(c0).replace(/[^0-9]/g,'').length>=7?c0:'');
    idx = isPhone0 ? {phone:0,name:1} : {name:0,phone:1,email:2};
  }
  var out=[];
  body.forEach(function(r){
    var g=function(k){ return idx[k]!=null && r[idx[k]]!=null ? String(r[idx[k]]).trim() : ''; };
    var name=g('name');
    if(!name){ name=[g('first'),g('last')].filter(Boolean).join(' ').trim(); }
    var phone=g('phone'), email=g('email');
    // stash any leftover columns as extra (keyed by header when present)
    var used={}; ['name','first','last','phone','email'].forEach(function(k){ if(idx[k]!=null) used[idx[k]]=1; });
    var extra={};
    r.forEach(function(v,i){ if(used[i]) return; v=String(v==null?'':v).trim(); if(!v) return; var key=(d.hasHeader&&header[i])?header[i]:('col'+(i+1)); extra[key]=v; });
    if(!name && !phone && !email && !Object.keys(extra).length) return;
    out.push({name:name,phone:phone,email:email,extra:extra});
  });
  return out;
}

// Readable-but-unguessable share token: street-address slug + a short random tail.
// (e.g. "2404-metts-dr-k7f2a") — friendlier than raw hex, still not enumerable.
function dispoSlugToken(address){
  var base=String(address||'').split(',')[0].toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  if(!base) base='deal';
  var chars='abcdefghijklmnopqrstuvwxyz0123456789', tail='';
  for(var i=0;i<5;i++) tail+=chars.charAt(Math.floor(Math.random()*chars.length));
  return base+'-'+tail;
}

async function dispoHandleCompFiles(files){
  files=Array.prototype.slice.call(files||[]).filter(function(f){ return /^image\//.test(f.type); });
  if(!files.length){ showToast('Drop image files only','error'); return; }
  dispoReadForm();
  showToast('Uploading '+files.length+' comp photo'+(files.length!==1?'s':'')+'…','info');
  for(var i=0;i<files.length;i++){
    try{ var u=await dispoUploadFile(files[i]); dispoDraft.compsPhotos.push(u); }
    catch(e){ showToast('One comp photo failed to upload','error'); }
  }
  dispoRenderCompStrip(); showToast('Comp photos added','success');
}

function dispoAddCompLinks(){

  if(!urls.length){ showToast('Paste image URLs (http…)','error'); return; }
  urls.forEach(function(u){ if(dispoDraft.compsPhotos.indexOf(u)<0) dispoDraft.compsPhotos.push(u); });
  el.value=''; dispoRenderCompStrip(); showToast('Added '+urls.length+' comp image'+(urls.length!==1?'s':''),'success');
}

async function dispoSaveDeal(){

function dispoMessageText(p){
  var lines=[]; lines.push('🏠 New deal'+(p.address?' — '+p.address.trim():''));

async function doBuyerImport(){
  var text=(document.getElementById('by-csv-text').value||'').trim();
  if(!text){ showToast('Paste CSV or choose a file first','error'); return; }
  var defArea=(document.getElementById('by-csv-area').value||'').trim();
  var rows=ltParseCSV(text);
  if(!rows.length){ showToast('No rows found','error'); return; }
  var first=rows[0].map(function(x){return String(x).trim().toLowerCase();});
  var known=['name','full name','first name','last name','phone','phone number','email','area','city','region','hot','hot buyer','buy box','buybox','criteria','tags','tag','notes','note'];
  var hasHeader=first.some(function(h){ return known.indexOf(h)>=0; });
  var idx={};
  if(hasHeader){
    first.forEach(function(h,i){
      if(h==='name'||h==='full name') idx.name=i;
      else if(h==='first name') idx.first=i;
      else if(h==='last name') idx.last=i;
      else if(h==='phone'||h==='phone number') idx.phone=i;
      else if(h==='email') idx.email=i;
      else if(h==='area'||h==='city'||h==='region') idx.area=i;
      else if(h==='hot'||h==='hot buyer') idx.hot=i;
      else if(h==='buy box'||h==='buybox'||h==='criteria') idx.buybox=i;
      else if(h==='tags'||h==='tag') idx.tags=i;
      else if(h==='notes'||h==='note') idx.notes=i;
    });
    rows=rows.slice(1);
  } else {
    idx={name:0,phone:1,email:2,area:3,hot:4,buybox:5,tags:6,notes:7};
  }
  var truthy=function(v){ v=String(v||'').trim().toLowerCase(); return v==='yes'||v==='y'||v==='true'||v==='1'||v==='hot'; };
  var toAdd=[];
  rows.forEach(function(r){
    var get=function(k){ return idx[k]!=null && r[idx[k]]!=null ? String(r[idx[k]]).trim() : ''; };
    var name=get('name');
    if(!name && (idx.first!=null||idx.last!=null)) name=[get('first'),get('last')].filter(Boolean).join(' ').trim();
    var phone=get('phone'), email=get('email');
    if(!name && !phone && !email) return;
    var tags=get('tags');
    var firstTag=tags?tags.split(/[;,]/)[0].trim():'';
    var area=get('area')||firstTag||defArea;
    var hot=idx.hot!=null?truthy(get('hot')):/\bhot\b/i.test(tags);
    toAdd.push({name:name,phone:phone,email:email,area:area,hot:hot,buyBox:get('buybox'),tags:tags,notes:get('notes')});
  });
  if(!toAdd.length){ showToast('Nothing to import','warning'); return; }
  // Skip duplicates: match on phone (last 10 digits), fall back to email. Checks buyers
  // already in the CRM AND repeats within this same file.
  var digits=function(p){ return String(p||'').replace(/\D/g,'').slice(-10); };
  var em=function(e){ return String(e||'').trim().toLowerCase(); };
  var seenPhone={}, seenEmail={};
  (crmBuyers||[]).forEach(function(b){ var d=digits(b.phone); if(d) seenPhone[d]=1; var e=em(b.email); if(e) seenEmail[e]=1; });
  var deduped=[], skipped=0;
  toAdd.forEach(function(r){
    var d=digits(r.phone), e=em(r.email);
    if((d && seenPhone[d]) || (!d && e && seenEmail[e])){ skipped++; return; }
    if(d) seenPhone[d]=1; if(e) seenEmail[e]=1;
    deduped.push(r);
  });
  if(!deduped.length){ closeModal(); showToast('All '+skipped+' buyer'+(skipped!==1?'s were':' was')+' already in your list — nothing new added','info'); return; }
  try {
    var inserted=await crmBuyerInsertMany(deduped);
    inserted.forEach(function(row){ crmBuyers.push(row); });
    closeModal();
    showToast('Imported '+inserted.length+' buyer'+(inserted.length!==1?'s':'')+(skipped?' · skipped '+skipped+' duplicate'+(skipped!==1?'s':''):''),'success');
    renderDispo();
  } catch(e){ showToast('Import failed — check the CSV and try again','error'); }
}

async function doBuyerSync(){
  var raw=(document.getElementById('bs-tags').value||'').trim();
  var tags=raw.split(',').map(function(s){return s.trim();}).filter(Boolean);
  if(!tags.length){ showToast('Type at least one buyer tag','error'); return; }
  try{ localStorage.setItem('crm_buyer_sync_tags', tags.join(', ')); }catch(e){}
  var go=document.getElementById('bs-go'); if(go){ go.disabled=true; go.textContent='Syncing…'; }
  var res=document.getElementById('bs-result'); if(res){ res.textContent='Pulling contacts from GoHighLevel…'; }
  try{
    var data=await buyerSyncCall({action:'pull', tags:tags});
    var pulled=data.buyers||[];
    if(!pulled.length){ if(res){ res.textContent='No GHL contacts found with '+(tags.length>1?'those tags':'that tag')+'.'; } if(go){ go.disabled=false; go.textContent='🔄 Sync Now'; } return; }
    var digits=function(p){ return String(p||'').replace(/\D/g,'').slice(-10); };
    var em=function(e){ return String(e||'').trim().toLowerCase(); };
    // Build a set of buyers already in the CRM (match on phone, fall back to email).
    var seenPhone={}, seenEmail={};
    (crmBuyers||[]).forEach(function(b){ var d=digits(b.phone); if(d) seenPhone[d]=1; var e=em(b.email); if(e) seenEmail[e]=1; });
    var toInsert=[], dupes=0;
    pulled.forEach(function(g){
      var d=g.phone10||digits(g.phone), e=em(g.email);
      var ghlTags=(g.tags||[]).map(function(t){return String(t).trim();}).filter(Boolean);
      // Already in the CRM, or a repeat within this same pull? -> duplicate, skip it.
      if((d && seenPhone[d]) || (!d && e && seenEmail[e])){ dupes++; return; }
      if(d) seenPhone[d]=1; if(e) seenEmail[e]=1;
      var phoneFmt=(d&&d.length===10)?('('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6)):(g.phone||'');
      toInsert.push({id:null,name:g.name||'',phone:phoneFmt,email:g.email||'',area:ghlTags[0]||'',hot:false,buyBox:'',tags:ghlTags.join(', '),notes:''});
    });
    if(toInsert.length){ var ins=await crmBuyerInsertMany(toInsert); ins.forEach(function(row){ crmBuyers.push(row); }); }
    closeModal();
    var msg='✅ '+toInsert.length+' new buyer'+(toInsert.length!==1?'s':'')+' added';
    msg += ' · '+dupes+' duplicate'+(dupes!==1?'s':'')+' skipped';
    showToast(msg, toInsert.length?'success':'info');
    renderDispo();
  }catch(e){ if(res){ res.textContent='Sync failed: '+e.message; } if(go){ go.disabled=false; go.textContent='🔄 Sync Now'; } }
}

// Persist ONE batch field. No re-render (the control already shows the new value) — keeps focus/scroll steady.
async function pbbSet(date,state,field,val){

// Set batch status AND re-render immediately so the chip counts, tiles and status chips all update

async function crmProbateSyncCall(f){

function pbScorePill(s){

function pbMoney(v){ if(v==null||v==='') return ''; var n=+v; if(isNaN(n)) return ''; return '$'+Math.round(n).toLocaleString(); }

// ---- GHL send (copy tag + open GHL, stamp sent-on) ----
async function pbSendGhl(id){
  var p=crmProbateById(id); if(!p) return;
  var tag=pbEffectiveTag(p); if(!tag){ showToast('No tag set','error'); return; }
  if(p.sentOn && !confirm('Already sent '+ltFmtDate(p.sentOn)+' (tag "'+(p.sentTag||tag)+'"). Send again and update the date?')) return;
  try { await navigator.clipboard.writeText(tag); showToast('Tag "'+tag+'" copied — paste it into GHL\'s Tag filter, then run your campaign','success'); }
  catch(e){ showToast('Filter GHL contacts by tag: '+tag,'warning'); }
  window.open(GHL_CONTACTS_URL,'_blank');
  p.sentOn=today(); p.sentTag=tag;
  (p.touches=p.touches||[]).push({date:today(),note:'Sent to GHL — tag "'+tag+'"'});
  try{ await crmProbateUpdate(p); }catch(e){ showToast('Sent, but the stamp did not save — Refresh & retry','error'); }
  if(activeSection==='probate') renderProbate();
}
async function pbUnsend(id){
  var p=crmProbateById(id); if(!p) return;
  if(!confirm('Clear the "sent" stamp on this lead?')) return;
  p.sentOn=''; p.sentTag='';
  try{ await crmProbateUpdate(p); showToast('Sent stamp cleared','success'); }catch(e){ showToast('Could not save — Refresh','error'); }
  if(activeSection==='probate') renderProbate();
}

// A lead's status is inherited from its batch (Not skip-traced / Skip-traced / Texted).
function pbLeadBatchStatus(p){
  var v=((pbbGet(p.datePulled,p.state)||{}).skiptraced)||'';
  if(v==='Yes') return 'scraped';
  if(v==='Texted') return 'texted';
  return 'notscraped';
}
function pbFilteredLeads(){
  var q=pbSearch.trim().toLowerCase();
  return (crmProbate||[]).filter(function(p){
    if(pbState && p.state!==pbState) return false;
    if(pbView==='notscraped' && pbLeadBatchStatus(p)!=='notscraped') return false;
    if(pbView==='scraped' && pbLeadBatchStatus(p)!=='scraped') return false;
    if(pbView==='texted' && pbLeadBatchStatus(p)!=='texted') return false;
    if(pbView==='followup' && !p.followUpDate) return false;
    if(pbView==='sent' && !p.sentOn) return false;
    if(pbView==='unsent' && p.sentOn) return false;
    if(pbView==='due'){ var n=ltDaysUntil(p.followUpDate); if(n===null || n>0) return false; }
    if(q){
      var hay=(p.decedentName+' '+p.propertyAddress+' '+p.propertyCity+' '+p.prName+' '+p.caseNumber+' '+p.county).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}

// upload the returned file to fill Name/Phone/Address in place (matched by id). ----
function pbCsvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }

// Download ONLY the checkbox-selected leads. Includes `id` (the match key on
// re-upload) + source_case_id + context, then three blank columns the skip
// tracer fills: Name / Phone Number / Address.
function pbDownloadSelectedCSV(){
  var rows=(crmProbate||[]).filter(function(p){ return pbSel.has(+p.id); });
  if(!rows.length){ showToast('Tick some leads first, then Download','error'); return; }
  var ctx=[['id','id'],['source_case_id','sourceCaseId'],['state','state'],['county','county'],
    ['decedent_name','decedentName'],['pr_name','prName'],['pr_address','prAddress'],
    ['property_address','propertyAddress'],['property_city','propertyCity'],['property_zip','propertyZip'],
    ['date_pulled','datePulled']];
  var head=ctx.map(function(c){return c[0];}).concat(['Name','Phone Number','Address']);
  var body=rows.map(function(p){
    var line=ctx.map(function(c){ return pbCsvCell(p[c[1]]); });
    line.push(pbCsvCell(p.skiptraceName), pbCsvCell(p.skiptracePhone), pbCsvCell(p.skiptraceAddress));
    return line.join(',');
  });
  var csv=head.join(',')+'\n'+body.join('\n');
  var blob=new Blob([csv],{type:'text/csv'}), url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download='probate-skiptrace-'+today()+'.csv'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  showToast('Downloaded '+rows.length+' lead'+(rows.length!==1?'s':'')+' for skip-tracing','success');
}

// Find the column index whose header matches any of `names` (case/space-insensitive).
function pbColIdx(header, names){
  var norm=function(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); };
  var H=header.map(norm);
  for(var n=0;n<names.length;n++){ var i=H.indexOf(norm(names[n])); if(i>=0) return i; }
  return -1;
}
function pbParseSkiptrace(text){
  var rows=ltParseCSV(text||''); if(rows.length<1) return null;
  var header=rows[0];
  var iId=pbColIdx(header,['id']);
  if(iId<0) return {error:'no_id'};
  var iName=pbColIdx(header,['Name','Owner Name','personal_rep','PR Name','Full Name','First Name']);
  var iPhone=pbColIdx(header,['Phone Number','Phone','Cell','Mobile','Wireless 1','Wireless','Phone 1']);
  var iAddr=pbColIdx(header,['Address','Mailing Address','personal_rep_address','Property Address']);
  var out=[];
  for(var r=1;r<rows.length;r++){
    var row=rows[r]; var idRaw=(row[iId]||'').trim(); if(!/^\d+$/.test(idRaw)) continue;
    out.push({ id:+idRaw,
      name:(iName>=0?(row[iName]||'').trim():''),
      phone:(iPhone>=0?(row[iPhone]||'').trim():''),
      address:(iAddr>=0?(row[iAddr]||'').trim():'') });
  }
  return {rows:out};
}
function pbSkiptracePreview(){
  var el=document.getElementById('pb-st-count'); if(!el) return;
  var p=pbParseSkiptrace(__pbImpText||(document.getElementById('pb-st-text')||{}).value||'');
  if(!p){ el.textContent=''; return; }
  if(p.error==='no_id'){ el.innerHTML='<span style="color:#dc2626">&#9888; No <b>id</b> column found — re-download the file from here so the id is included.</span>'; return; }
  var known=(crmProbate||[]); var ids=new Set(known.map(function(x){return +x.id;}));
  var match=p.rows.filter(function(x){ return ids.has(x.id); }).length;

// ---- Replace a whole batch with an uploaded skip-traced list (no id needed) ----
// The skip-tracer returns First Name / Last Name / Phone Number / Address (no CRM id),
// so instead of matching we DELETE the batch's current leads and insert the file's rows
// as fresh Scraped leads. Used on Not-Scraped batches from the batch detail panel.
function pbSplitAddr(full){
  if(!full) return {street:'',city:'',zip:''};
  var parts=String(full).split(',').map(function(s){return s.trim();});
  var street=parts[0]||'', city='', zip='';
  if(parts.length>=3){ city=parts[1]||''; var m=(parts[parts.length-1]||'').match(/\d{5}(?:-\d{4})?/); zip=m?m[0]:''; }
  else if(parts.length===2){ city=parts[1]||''; }
  return {street:street,city:city,zip:zip};
}
function pbParseReplace(text){
  var rows=ltParseCSV(text||''); if(rows.length<2) return {rows:[]};
  var header=rows[0];
  var iFirst=pbColIdx(header,['First Name','First','firstname']);
  var iLast=pbColIdx(header,['Last Name','Last','lastname']);
  var iName=pbColIdx(header,['Name','Full Name','Owner Name','personal_rep','PR Name']);
  var iPhone=pbColIdx(header,['Phone Number','Phone','Cell','Mobile','Wireless 1','Wireless','Phone 1']);
  var iAddr=pbColIdx(header,['Address','Mailing Address','personal_rep_address','Property Address','Street Address','Street','Source']);
  var out=[];
  for(var r=1;r<rows.length;r++){
    var row=rows[r];
    var nm = iName>=0 ? (row[iName]||'').trim()
      : [iFirst>=0?(row[iFirst]||'').trim():'', iLast>=0?(row[iLast]||'').trim():''].filter(Boolean).join(' ');
    var ph = iPhone>=0?(row[iPhone]||'').trim():'';
    var ad = iAddr>=0?(row[iAddr]||'').trim():'';
    if(!nm && !ph && !ad) continue;
    out.push({name:nm,phone:ph,address:ad});
  }
  return {rows:out, cols:{name:(iName>=0||iFirst>=0||iLast>=0), phone:iPhone>=0, addr:iAddr>=0}};
}

// Insert in chunks; collects the new row ids into `collect` AS IT GOES so a mid-way

async function crmProbateInsertMany(records, collect){

    var res=await sbFetch(PB_PATH,'POST',records.slice(i,i+200));

  }
}

// =================== Shared: delete-with-undo ===================
// Optimistic delete used by List Tracking, Probate, Buyers, and Deals. Removes the row(s)
// from the in-memory array + re-renders immediately, shows a 5-6s Undo toast, and only
// hits the DB AFTER the undo window closes. Undo cancels the DB delete and restores the
// rows — no schema change, no re-insert, ids preserved. A new delete commits any still-
// pending one first. Commit fires at 6200ms so it's always after the toast's 6000ms Undo.
var __pendingDel = null;
// Multi-select sets per section (ids).
var ltSel=new Set(), pbSel=new Set(), bySel=new Set(), dpSel=new Set();
function pbToggle(id,c){ if(c)pbSel.add(+id); else pbSel.delete(+id); pbRenderArea(); }
function ltToggle(id,c){ if(c)ltSel.add(+id); else ltSel.delete(+id); ltRenderListArea(); }
function byToggle(id,c){ if(c)bySel.add(+id); else bySel.delete(+id); byRenderArea(); }
function dpToggle(id,c){ if(c)dpSel.add(+id); else dpSel.delete(+id); var el=document.getElementById('dp-deals'); if(el) el.innerHTML=dispoDealsHTML(); }
// Bulk action bar shown above a table when rows are selected.
function bulkBar(count, clearFn, delFn, extraBtns){
  if(!count) return '';
  return '<div style="background:#fff3cd;border:1.5px solid #fcd34d;border-radius:8px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    + '<span style="font-size:13px;font-weight:600;color:#b45309">&#10003; '+count+' selected</span>'
    + '<div style="display:flex;gap:8px">'+(extraBtns||'')+'<button class="btn btn-secondary btn-sm" onclick="'+clearFn+'">Clear</button>'
    + '<button class="btn btn-danger btn-sm" onclick="'+delFn+'">&#128465; Delete '+count+'</button></div></div>';
}
function deleteWithUndo(opts){
  if(__pendingDel){ var p=__pendingDel; __pendingDel=null; clearTimeout(p.timer); p.commit(); }
  opts.removeMem(); opts.reRender();
  var committed=false;
  function commit(){ if(committed) return; committed=true;
    Promise.resolve().then(opts.dbDelete).catch(function(){ showToast('Delete failed to sync — Refresh','error'); }); }
  var timer=setTimeout(function(){ __pendingDel=null; commit(); }, 6200);
  __pendingDel={timer:timer, commit:commit};
  showToast(opts.label,'warning',function(){
    clearTimeout(timer); __pendingDel=null; opts.restoreMem(); opts.reRender();
    showToast('Restored','success');
  });
}
// A checkbox that stops row-click propagation, bound to a selection Set via a toggle fn.
function selChk(setName, id, checked){
  return '<input type="checkbox" '+(checked?'checked':'')+' onclick="event.stopPropagation()" onchange="'+setName+'('+id+',this.checked)" style="width:15px;height:15px;cursor:pointer">';
}

// =================== Checklist Notes (crm_note_items) — additive, CRM-side only ===================
// A reusable checklist that lives UNDER each existing free-text notes box (never replaces it).
// Not-done items sort first, done (crossed-out) items sink to the bottom. Persists to its own
// table keyed by (entity_type, entity_id) so no existing table/column is touched.
const NCI_PATH = 'crm_note_items';
var nciCache = {};    // "type:id" -> array of {id,entityType,entityId,text,done,position}
var nciLoading = {};  // "type:id" -> bool (guards double-load)
function nciKey(t,id){ return t+':'+id; }
function nciFromDb(r){ return {id:r.id,entityType:r.entity_type,entityId:r.entity_id,text:r.text||'',done:!!r.done,position:r.position||0,createdAt:r.created_at||''}; }
function nciToDb(it){ return {entity_type:it.entityType,entity_id:it.entityId,text:it.text||'',done:!!it.done,position:it.position||0,created_by:(typeof currentUser!=='undefined'&&currentUser?currentUser.name:'')||'',updated_at:new Date().toISOString()}; }
// not-done first, then manual position, then id — mirrors the DB order clause.
function nciSort(arr){ return (arr||[]).slice().sort(function(a,b){
  if(a.done!==b.done) return a.done?1:-1;
  if((a.position||0)!==(b.position||0)) return (a.position||0)-(b.position||0);
  return (a.id>b.id?1:(a.id<b.id?-1:0)); }); }
function nciItem(key,itemId){ return (nciCache[key]||[]).find(function(x){ return x.id===itemId; }); }
function nciPending(it){ return !it || typeof it.id!=='number'; } // temp (not-yet-saved) rows have string ids

// HTML for the checklist section — a container that nciMount() fills in after the modal paints.
// Returns '' (renders nothing) for unsaved/new records that have no id yet.
function noteChecklistHTML(entityType, entityId){
  if(entityId===null||entityId===undefined||entityId==='') return '';
  var cid='nci-'+entityType+'-'+entityId;
  return '<div class="nci-wrap">'
    + '<div class="nci-title">&#9745; Checklist</div>'
    + '<div class="nci-add"><input id="'+cid+'-input" class="form-input nci-input" placeholder="Add a checklist item&hellip;" '
      + 'onkeydown="if(event.key===&quot;Enter&quot;){event.preventDefault();nciAdd(&quot;'+entityType+'&quot;,'+entityId+')}">'
      + '<button type="button" class="btn btn-secondary btn-sm" onclick="nciAdd(&quot;'+entityType+'&quot;,'+entityId+')">&#43; Add</button></div>'
    + '<div id="'+cid+'" class="nci-list"><div class="nci-loading">Loading&hellip;</div></div>'
    + '</div>';
}
// Lazy-load an entity's items (cached), then paint. Call right after a modal/section innerHTML is set.
async function nciMount(entityType, entityId){
  if(entityId===null||entityId===undefined||entityId==='') return;
  var key=nciKey(entityType,entityId);
  if(nciCache[key]){ nciRender(entityType,entityId); return; }
  if(nciLoading[key]) return;
  nciLoading[key]=true;
  try {
    var rows=await sbFetch(NCI_PATH+'?entity_type=eq.'+encodeURIComponent(entityType)+'&entity_id=eq.'+entityId+'&order=done.asc,position.asc,id.asc&limit=1000');
    nciCache[key]=(rows||[]).map(nciFromDb);
  } catch(e){ nciCache[key]=[]; }
  nciLoading[key]=false;
  nciRender(entityType,entityId);
}
// Re-render ONLY the checklist container (keeps modal focus/scroll steady, like pbbSet).
function nciRender(entityType, entityId){
  var box=document.getElementById('nci-'+entityType+'-'+entityId); if(!box) return;
  var items=nciSort(nciCache[nciKey(entityType,entityId)]||[]);
  if(!items.length){ box.innerHTML='<div class="nci-empty">No checklist items yet.</div>'; return; }
  box.innerHTML=items.map(function(it){
    return '<div class="nci-row'+(it.done?' nci-done':'')+'">'
      + '<input type="checkbox" class="nci-chk"'+(it.done?' checked':'')+(nciPending(it)?' disabled':'')+' onchange="nciToggle(&quot;'+entityType+'&quot;,'+entityId+',this.getAttribute(&quot;data-iid&quot;)*1)" data-iid="'+it.id+'">'
      + '<span class="nci-text" title="Double-click to edit" ondblclick="nciEditText(&quot;'+entityType+'&quot;,'+entityId+','+(nciPending(it)?'0':it.id)+')">'+esc(it.text)+'</span>'
      + '<button type="button" class="nci-del" title="Delete"'+(nciPending(it)?' disabled':'')+' onclick="nciDelete(&quot;'+entityType+'&quot;,'+entityId+','+(nciPending(it)?'0':it.id)+')">&#128465;</button>'
      + '</div>';
  }).join('');
}
// Add an item (optimistic; rolls back if the insert fails).
async function nciAdd(entityType, entityId){
  var inp=document.getElementById('nci-'+entityType+'-'+entityId+'-input'); if(!inp) return;
  var txt=(inp.value||'').trim(); if(!txt) return;
  var key=nciKey(entityType,entityId);
  var arr=nciCache[key]||(nciCache[key]=[]);
  var maxPos=arr.reduce(function(m,x){ return Math.max(m,x.position||0); },0);
  var temp={id:'tmp'+Date.now(),entityType:entityType,entityId:+entityId,text:txt,done:false,position:maxPos+1};
  arr.push(temp); inp.value=''; nciRender(entityType,entityId);
  try {
    var rows=await sbFetch(NCI_PATH,'POST',nciToDb(temp));
    if(rows&&rows[0]) temp.id=rows[0].id;
    nciRender(entityType,entityId);
  } catch(e){
    var i=arr.indexOf(temp); if(i>=0) arr.splice(i,1);
    nciRender(entityType,entityId);
    showToast('Could not add item — check connection','error');
  }
  var again=document.getElementById('nci-'+entityType+'-'+entityId+'-input'); if(again) again.focus();
}
// Check/uncheck -> cross out + re-sort (done sinks to bottom), then persist.
async function nciToggle(entityType, entityId, itemId){
  var key=nciKey(entityType,entityId);
  var it=nciItem(key,itemId); if(!it || nciPending(it)) return;
  it.done=!it.done;
  nciRender(entityType,entityId);
  try { await sbFetch(NCI_PATH+'?id=eq.'+itemId,'PATCH',{done:it.done,updated_at:new Date().toISOString()}); }
  catch(e){ it.done=!it.done; nciRender(entityType,entityId); showToast('Could not update — check connection','error'); }
}
// Inline edit via prompt (empty text deletes).
function nciEditText(entityType, entityId, itemId){
  if(!itemId) return;
  var key=nciKey(entityType,entityId);
  var it=nciItem(key,itemId); if(!it || nciPending(it)) return;
  var nv=prompt('Edit checklist item:', it.text);
  if(nv===null) return;
  nv=nv.trim();
  if(!nv){ nciDelete(entityType,entityId,itemId); return; }
  var old=it.text; it.text=nv; nciRender(entityType,entityId);
  sbFetch(NCI_PATH+'?id=eq.'+itemId,'PATCH',{text:nv,updated_at:new Date().toISOString()})
    .catch(function(){ it.text=old; nciRender(entityType,entityId); showToast('Could not save edit — check connection','error'); });
}
// Delete with the app's shared 6s Undo (safe against accidental removal).
function nciDelete(entityType, entityId, itemId){
  if(!itemId) return;
  var key=nciKey(entityType,entityId);
  var arr=nciCache[key]||[];
  var idx=arr.findIndex(function(x){ return x.id===itemId; });
  if(idx<0) return;
  var removed=arr[idx];
  deleteWithUndo({
    label:'Checklist item deleted',
    removeMem:function(){ var i=arr.findIndex(function(x){ return x.id===itemId; }); if(i>=0) arr.splice(i,1); },
    restoreMem:function(){ arr.splice(Math.min(idx,arr.length),0,removed); },
    dbDelete:function(){ return sbFetch(NCI_PATH+'?id=eq.'+itemId,'DELETE'); },
    reRender:function(){ nciRender(entityType,entityId); }
  });
}

// =================== P5: Ask AI (free, rule-based NL query over the whole CRM) ===================
// A floating "Ask AI" button (bottom-right, every page) opens a search panel. Mike types plain
// English; a deterministic parser maps it to filters and runs them across every section in memory
// (leads, tasks, lists, probate, buyers, deals). $0, offline, no key, no data leaves the browser.
var ASK_ST={DC:['dc','washington dc','district of columbia'],MD:['md','maryland'],VA:['va','virginia'],
  NC:['nc','north carolina'],SC:['sc','south carolina'],TX:['tx','texas'],GA:['ga','georgia'],KY:['ky','kentucky']};
function askStateOf(text){
  var s=' '+String(text||'').toLowerCase()+' ', out=[];
  for(var c in ASK_ST){ for(var i=0;i<ASK_ST[c].length;i++){
    if(new RegExp('\\b'+ASK_ST[c][i].replace(/ /g,'\\s+')+'\\b').test(s)){ out.push(c); break; }
  } }
  return out;
}
function askDueMatch(date,due){
  if(!due) return true; if(!date) return false;
  var n=ltDaysUntil(date); if(n===null) return false;
  if(due==='overdue') return n<0;
  if(due==='today')   return n===0;
  if(due==='week')    return n>=0&&n<=7;
  if(due==='due')     return n<=7;
  return true;
}
function askDateInRange(date,range){ if(!range) return true; if(!date) return false; var d=String(date).slice(0,10); return d>=range.from&&d<=range.to; }

var ASK_STOP={};
('show all me my the a an of for with without list lists tracking buyer buyers probate task tasks jv deal deals '
+'property properties dispo listing listings lead leads seller sellers outreach contact contacts prospect prospects '
+'how many much number count total hot sent unsent yet never due overdue past late today yesterday week weeks month '
+'months this last next follow followup follow-up up date dates no none dc washington district columbia md maryland '
+'va virginia nc north sc south carolina tx texas ga georgia ky kentucky wholesaler wholesalers wholesale realtor '
+'realtors agent agents pulled scanned added imported texted and in on to from are is which what who whose that have '
+'has had i we our us 7 30 days day new missing show all get find give any there do does did doing done have '
+'having having want wanna need needs see show display pull list them then please got ghl gohighlevel go high level '
+'follow-ups followups leads-i can could would should about into over under still yet ones one entry entries '
+'record records people person deal-desk mine not never no none without everything anything something stuff '
+'things thing everyone anybody someone items item info information data current all-of by at as').split(/\s+/).forEach(function(w){ if(w) ASK_STOP[w]=1; });

function askRange(t){
  var verb=null;
  if(/\bsent\b/.test(t)) verb='sent';
  else if(/\bpulled\b|\bscanned\b/.test(t)) verb='pulled';
  else if(/\badded\b|\bimported\b/.test(t)) verb='added';
  else if(/\btexted\b/.test(t)) verb='texted';
  var now=new Date(today()+'T00:00:00');
  function iso(d){ return d.toISOString().slice(0,10); }
  function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
  function weekStart(d){ var x=new Date(d), day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
  var r=null;
  if(/\byesterday\b/.test(t)){ var y=addDays(now,-1); r={from:iso(y),to:iso(y)}; }
  else if(/\blast 7 days\b|\bpast 7 days\b|\bpast week\b/.test(t)) r={from:iso(addDays(now,-7)),to:iso(now)};
  else if(/\blast 30 days\b|\bpast 30 days\b|\bpast month\b/.test(t)) r={from:iso(addDays(now,-30)),to:iso(now)};
  else if(/\blast week\b/.test(t)){ var lws=addDays(weekStart(now),-7); r={from:iso(lws),to:iso(addDays(lws,6))}; }
  else if(/\bthis week\b/.test(t)){ var ws=weekStart(now); r={from:iso(ws),to:iso(addDays(ws,6))}; }
  else if(/\bnext week\b/.test(t)){ var ws2=addDays(weekStart(now),7); r={from:iso(ws2),to:iso(addDays(ws2,6))}; }
  else if(/\bthis month\b/.test(t)) r={from:iso(new Date(now.getFullYear(),now.getMonth(),1)),to:iso(new Date(now.getFullYear(),now.getMonth()+1,0))};
  else if(/\blast month\b/.test(t)) r={from:iso(new Date(now.getFullYear(),now.getMonth()-1,1)),to:iso(new Date(now.getFullYear(),now.getMonth(),0))};
  if(r) r.verb=verb;
  return r;
}

function askParse(q){
  var s={raw:q,sections:null,count:false,states:[],categories:[],hot:false,sent:null,due:null,noFollowup:false,range:null,text:[]};
  var t=' '+String(q||'').toLowerCase().replace(/[?!,.]/g,' ').replace(/\s+/g,' ')+' ';
  if(/\b(how many|how much|number of|count of|count|total)\b/.test(t)) s.count=true;
  // sections (strong keywords win over the generic "leads")
  var strong=[];
  if(/\b(buyer|buyers)\b/.test(t)) strong.push('buyers');
  if(/\b(list|lists|tracking)\b/.test(t)) strong.push('lists');
  if(/\bprobate\b/.test(t)) strong.push('probate');
  if(/\b(task|tasks|jv)\b/.test(t)) strong.push('tasks');
  if(/\b(deal|deals|property|properties|dispo|listing|listings)\b/.test(t)) strong.push('deals');
  // categories only make sense for lists; "buyer lists" => lists+category buyer, not the Buyers section
  if(strong.indexOf('lists')>=0){
    if(/\bwholesaler|wholesalers|wholesale\b/.test(t)) s.categories.push('wholesaler');
    if(/\brealtor|realtors|agent|agents\b/.test(t)) s.categories.push('realtor');
    if(/\bseller|sellers\b/.test(t)) s.categories.push('seller');
    if(/\bbuyer|buyers\b/.test(t)){ s.categories.push('buyer'); var bi=strong.indexOf('buyers'); if(bi>=0) strong.splice(bi,1); }
  }
  var weakLeads=/\b(lead|leads|seller|sellers|outreach|contact|contacts|prospect|prospects)\b/.test(t);
  if(strong.length) s.sections=strong.filter(function(v,i){return strong.indexOf(v)===i;});
  else if(weakLeads) s.sections=['leads'];
  else s.sections=null;
  // states
  for(var c in ASK_ST){ for(var i=0;i<ASK_ST[c].length;i++){ if(new RegExp('\\b'+ASK_ST[c][i].replace(/ /g,'\\s+')+'\\b').test(t)){ s.states.push(c); break; } } }
  // flags
  if(/\bhot\b/.test(t)||/\ud83d\udd25/.test(q)) s.hot=true;
  if(/\bnot sent\b|\bunsent\b|\bhaven'?t sent\b|\bnever sent\b|\bnot yet sent\b|\bno sent\b/.test(t)) s.sent='no';
  else if(/\bsent\b/.test(t)) s.sent='yes';
  if(/\boverdue\b|\bpast due\b/.test(t)) s.due='overdue';
  else if(/\bdue today\b/.test(t)) s.due='today';
  else if((/\bthis week\b/.test(t)||/\bweek\b/.test(t))&&/\bdue\b/.test(t)) s.due='week';
  else if(/\bfollow[- ]?up(s)? due\b|\bdue\b/.test(t)) s.due='due';
  if(/\bno follow[- ]?up\b|\bwithout (a )?follow[- ]?up\b|\bmissing (a )?follow[- ]?up\b|\bno (follow[- ]?up )?date\b|\bno date\b/.test(t)) s.noFollowup=true;
  s.range=askRange(t);
  if(s.due && s.range && !s.range.verb) s.range=null; // a bare "this week"/"today" is handled by due
  // leftover free text = names/streets/phones to search for
  s.text=t.trim().split(' ').filter(function(w){ w=w.trim(); return w.length>=2 && !ASK_STOP[w]; });
  return s;
}

function askStateHit(recStateCodes,want){ if(!want.length) return true; return want.some(function(x){return recStateCodes.indexOf(x)>=0;}); }
function askTextHit(hay,terms){ if(!terms.length) return true; hay=String(hay||'').toLowerCase(); return terms.every(function(w){ return hay.indexOf(w)>=0; }); }

function askMatchLead(l,s){
  if(s.hot && String(l.score||'').toLowerCase()!=='hot') return false;
  if(s.states.length && !askStateHit(askStateOf(l.location),s.states)) return false;
  if(s.due && !askDueMatch(l.followUpDate,s.due)) return false;
  if(s.noFollowup && l.followUpDate) return false;
  if(s.sent==='yes' && !l.shared) return false;
  if(s.sent==='no' && l.shared) return false;
  if(s.range){ var f=(s.range.verb==='added')?l.dateAdded:l.followUpDate; if(!askDateInRange(f,s.range)) return false; }
  return askTextHit((l.name||'')+' '+(l.phone||'')+' '+(l.location||'')+' '+(l.notes||'')+' '+(l.jvStatus||''),s.text);
}
function askMatchList(l,s){
  if(s.sent) return false; // lists have no "sent" workflow
  if(s.categories.length && s.categories.indexOf((l.category||'seller').toLowerCase())<0) return false;
  if(s.states.length){ var reg=(l.region||'').toUpperCase(); if(!(s.states.indexOf(reg)>=0 || askStateHit(askStateOf((l.name||'')+' '+reg),s.states))) return false; }
  if(s.due && !askDueMatch(l.dueDate,s.due)) return false;
  if(s.noFollowup && l.dueDate) return false;
  if(s.range){ var vb=s.range.verb, f=(vb==='added')?l.dateAdded:(vb==='texted'?ltLastTexted(l):l.dueDate); if(!askDateInRange(f,s.range)) return false; }
  return askTextHit((l.name||'')+' '+(l.region||'')+' '+(l.category||'')+' '+(l.notes||'')+' '+(l.amount||''),s.text);
}
function askMatchProbate(p,s){
  if(s.states.length && s.states.indexOf((p.state||'').toUpperCase())<0) return false;
  if(s.sent==='yes' && !p.sentOn) return false;
  if(s.sent==='no' && p.sentOn) return false;
  if(s.due && !askDueMatch(p.followUpDate,s.due)) return false;
  if(s.noFollowup && p.followUpDate) return false;
  if(s.range){ var vb=s.range.verb, f=(vb==='sent')?p.sentOn:((vb==='pulled'||vb==='added')?p.datePulled:p.followUpDate); if(!askDateInRange(f,s.range)) return false; }
  return askTextHit((p.decedentName||'')+' '+(p.propertyAddress||'')+' '+(p.state||'')+' '+(p.county||'')+' '+(p.prName||'')+' '+(p.prPhone||'')+' '+(p.notes||'')+' '+(p.status||''),s.text);
}
function askMatchBuyer(b,s){
  if(s.due || s.noFollowup) return false; // buyers have no follow-up date — never surface for due/no-follow-up queries
  if(s.sent) return false;                // nor a "sent" concept
  if(s.hot && !b.hot) return false;
  if(s.states.length && !askStateHit(askStateOf((b.area||'')+' '+(b.tags||'')+' '+(b.buyBox||'')),s.states)) return false;
  return askTextHit((b.name||'')+' '+(b.email||'')+' '+(b.phone||'')+' '+(b.area||'')+' '+(b.tags||'')+' '+(b.buyBox||'')+' '+(b.notes||''),s.text);
}
function askMatchDeal(p,s){
  if(s.due || s.noFollowup || s.sent) return false; // deals have no follow-up/sent workflow
  if(s.states.length && !askStateHit(askStateOf(p.address),s.states)) return false;
  if(s.range && !askDateInRange(p.createdAt,s.range)) return false;
  return askTextHit((p.address||'')+' '+(p.price||'')+' '+(p.notes||'')+' '+(p.status||''),s.text);
}

function askExec(s){
  var g={leads:[],tasks:[],lists:[],probate:[],buyers:[],deals:[]};
  function on(k){ return !s.sections || s.sections.indexOf(k)>=0; }
  if(on('leads')) (leads||[]).filter(function(l){return !l.deleted;}).forEach(function(l){ if(askMatchLead(l,s)) g.leads.push({kind:'lead',id:l.id,
    title:l.name||l.phone||('Lead #'+l.id), sub:[l.location,l.jvStatus,(String(l.score||'').toLowerCase()==='hot'?'\ud83d\udd25 Hot':'')].filter(Boolean).join(' \u00b7 '), date:l.followUpDate||''}); });
  if(on('tasks')) (jvLeads||[]).filter(function(t){return !t.deleted;}).forEach(function(tk){ if(askMatchLead(tk,s)) g.tasks.push({kind:'task',id:tk.id,
    title:tk.name||tk.phone||('Task #'+tk.id), sub:[tk.location,tk.jvStatus].filter(Boolean).join(' \u00b7 '), date:tk.followUpDate||''}); });
  if(on('lists')) (crmLists||[]).forEach(function(l){ if(askMatchList(l,s)) g.lists.push({kind:'list',id:l.id,
    title:l.name||('List #'+l.id), sub:[l.category,l.region,(l.amount?l.amount+' records':'')].filter(Boolean).join(' \u00b7 '), date:l.dueDate||''}); });
  if(on('probate')) (crmProbate||[]).forEach(function(p){ if(askMatchProbate(p,s)) g.probate.push({kind:'probate',id:p.id,
    title:p.decedentName||p.propertyAddress||('Probate #'+p.id), sub:[p.state,p.propertyAddress,(p.sentOn?'\u2713 Sent '+ltFmtDate(p.sentOn):'')].filter(Boolean).join(' \u00b7 '), date:p.followUpDate||''}); });
  if(on('buyers')) (crmBuyers||[]).forEach(function(b){ if(askMatchBuyer(b,s)) g.buyers.push({kind:'buyer',id:b.id,
    title:b.name||b.phone||('Buyer #'+b.id), sub:[b.area,(b.hot?'\ud83d\udd25 Hot':''),b.buyBox].filter(Boolean).join(' \u00b7 '), date:''}); });
  if(on('deals')) (crmProps||[]).forEach(function(p){ if(askMatchDeal(p,s)) g.deals.push({kind:'deal',id:p.id,
    title:p.address||('Deal #'+p.id), sub:[p.price,(p.beds?p.beds+'bd':''),(p.baths?p.baths+'ba':''),p.status].filter(Boolean).join(' \u00b7 '), date:''}); });
  return g;
}

var ASK_ORDER=[['leads','\ud83c\udfe0 Leads'],['tasks','\u2705 Tasks'],['lists','\ud83d\udcc7 Lists'],['probate','\u2696\ufe0f Probate'],['buyers','\ud83e\udd1d Buyers'],['deals','\ud83c\udff7\ufe0f Deals']];
function askRenderResults(g,s,q){
  var total=0; ASK_ORDER.forEach(function(o){ total+=g[o[0]].length; });
  var html='';
  if(s.count){
    var chips=ASK_ORDER.filter(function(o){return g[o[0]].length;}).map(function(o){return '<span class="ask-chip-count">'+o[1]+' '+g[o[0]].length+'</span>';}).join('');
    html+='<div class="ask-answer"><div class="ask-answer-n">'+total+'</div><div class="ask-answer-l">'+(total===1?'match':'matches')+(chips?'<br>'+chips:'')+'</div></div>';
  } else {
    html+='<div class="ask-answer-line">'+(total?('Found <b>'+total+'</b> '+(total===1?'result':'results')):'No matches')+'</div>';
  }
  if(!total){
    html+='<div class="ask-empty">Nothing matched \u201c'+esc(q)+'\u201d. Try things like <i>DC buyers</i>, <i>lists due this week</i>, <i>overdue follow-ups</i>, or <i>probate sent last week</i>.</div>';
    return html;
  }
  ASK_ORDER.forEach(function(o){
    var arr=g[o[0]]; if(!arr.length) return;
    html+='<div class="ask-grp"><div class="ask-grp-h">'+o[1]+' <span>'+arr.length+'</span></div>';
    arr.slice(0,50).forEach(function(r){
      html+='<div class="ask-row" onclick="askOpen(\''+r.kind+'\','+r.id+')">'
        +'<div class="ask-row-t">'+esc(r.title)+'</div>'
        +(r.sub?'<div class="ask-row-s">'+esc(r.sub)+'</div>':'')
        +(r.date?'<div class="ask-row-d">Due '+ltFmtDate(r.date)+'</div>':'')
      +'</div>';
    });
    if(arr.length>50) html+='<div class="ask-more">+'+(arr.length-50)+' more\u2026 narrow your question to see them</div>';
    html+='</div>';
  });
  return html;
}
function askWelcomeHTML(){
  var ex=['show all DC buyers','lists due this week','overdue follow-ups','leads with no follow-up','probate sent last week','how many wholesaler lists','hot buyers','MD probate not sent'];
  return '<div class="ask-welcome"><div class="ask-w-h">Try one of these</div>'
    + ex.map(function(e){return '<button class="ask-ex" onclick="askRun(this.textContent)">'+esc(e)+'</button>';}).join('')
    + '<div class="ask-w-note">Searches Leads, Tasks, Lists, Probate, Buyers &amp; Deals \u2014 100% free, instant, and nothing leaves your browser.</div></div>';
}
function askEnsureData(){
  var need=[];
  if(typeof crmLists!=='undefined' && crmLists===null)   need.push(crmListsFetch());
  if(typeof crmProbate!=='undefined' && crmProbate===null) need.push(crmProbateFetch());
  if(typeof crmBuyers!=='undefined' && crmBuyers===null)  need.push(crmBuyersFetch());
  if(typeof crmProps!=='undefined' && crmProps===null)    need.push(crmPropsFetch());
  return need.length?Promise.all(need):Promise.resolve();
}
function askRun(pref){
  var inp=document.getElementById('ask-input'); if(!inp) return;
  if(pref!=null) inp.value=pref;
  var q=(inp.value||'').trim();
  var res=document.getElementById('ask-results'); if(!res) return;
  if(!q){ res.innerHTML=askWelcomeHTML(); return; }
  res.innerHTML='<div class="ask-loading">\u2728 Thinking\u2026</div>';
  askEnsureData().then(function(){
    try { var s=askParse(q); var g=askExec(s); res.innerHTML=askRenderResults(g,s,q); }
    catch(e){ res.innerHTML='<div class="ask-empty">Something went wrong reading that. Try simpler words like <i>DC buyers</i> or <i>overdue follow-ups</i>.</div>'; }
  });
}
function askMount(){
  var root=document.getElementById('ask-root'); if(!root||root.getAttribute('data-mounted')==='1') return;
  root.setAttribute('data-mounted','1');
  root.innerHTML =
    '<button id="ask-fab" class="ask-fab" onclick="askToggle(true)" title="Ask AI about your CRM"><span class="ask-fab-ic">\u2728</span><span class="ask-fab-tx">Ask AI</span></button>'
    +'<div id="ask-overlay" class="ask-overlay" onclick="askOverlayClick(event)">'
      +'<div class="ask-panel">'
        +'<div class="ask-head"><span class="ask-title">\u2728 Ask AI <small>your CRM, in plain English</small></span><button class="ask-x" onclick="askToggle(false)">\u2715</button></div>'
        +'<div class="ask-searchbar"><input id="ask-input" class="ask-input" type="text" placeholder="Ask anything\u2026 e.g. show all DC buyers" onkeydown="if(event.key===\'Enter\')askRun()"><button class="ask-go" onclick="askRun()">Ask</button></div>'
        +'<div id="ask-results" class="ask-results"></div>'

  if(open){ ov.classList.add('open'); var r=document.getElementById('ask-results'); if(r&&!r.innerHTML.trim()) r.innerHTML=askWelcomeHTML(); askEnsureData(); setTimeout(function(){ var i=document.getElementById('ask-input'); if(i) i.focus(); },50); }
  else ov.classList.remove('open');
}
function askOverlayClick(e){ if(e.target&&e.target.id==='ask-overlay') askToggle(false); }
function askOpen(kind,id){
  askToggle(false);
  if(kind==='buyer'){ setSection('dispo'); setTimeout(function(){ openBuyerEditModal(id); },70); return; }
  if(kind==='deal'){ setSection('dispo'); setTimeout(function(){ dispoEditDeal(id); },70); return; }
  dashOpen(kind,id); // list / probate / task / lead
}

function render(){
  // No active user: when auth is ON, always show the access-key login (never the legacy
  // name-picker, which would bypass authentication); when off, show the legacy picker.
  if(!currentUser){
    if(AUTH_ENABLED){ renderAuthLogin(); }
    else { renderLogin(); document.getElementById('app').innerHTML=''; }
    return;
  }
  // Paint the sidebar shell + the main content container, then fill the active section.
  document.getElementById('app').innerHTML = sidebarHTML() + '<div id="section-main" class="section-main"></div>';
  askMount(); // floating "Ask AI" button (mounts once to #ask-root; survives re-renders)
  if(activeSection==='lists'){ renderLists(); return; }
  if(activeSection==='dispo'){ renderDispo(); return; }
  if(activeSection==='probate'){ renderProbate(); return; }
  if(activeSection==='dashboard'){ renderDashboard(); return; }
  if(activeSection!=='outreach'){ renderPlaceholderSection(activeSection); return; }
  renderOutreach();
}

function buildTempScoreViewHTML(score){

  var typeBg = {DMV:'#eff6ff',Nationwide:'#e0f2fe',Task:'#ede9fe'};
  var items = [];
  leads.forEach(function(l){
    if(!l.deleted && l.leadSource!=='D4D Auto-Scan' && l.score===score){
      items.push({id:l.id,type:l.nationwide==='Yes'?'Nationwide':'DMV',isTask:false,label:l.address||l.name||'Untitled',offer:l.offer,arv:l.arv,followUpDate:l.followUpDate,status:l.status});
    }
  });
  jvLeads.forEach(function(l){
    if(!l.deleted && l.score===score){
      items.push({id:l.id,type:'Task',isTask:true,label:l.name||l.location||'Untitled',offer:l.askingPrice,arv:l.arv,followUpDate:l.followUpDate,status:l.jvStatus});
    }
  });
  var rows = items.length===0
    ? '<div class="empty"><div class="empty-icon">&#128302;</div><h3>No '+score+' leads</h3></div>'
    : '<div class="table-container"><div class="table-wrap"><table>'
      +'<thead><tr><th>Lead</th><th>Type</th><th>Offer</th><th>ARV</th><th>Follow-Up</th><th>Status</th></tr></thead><tbody>'
      + items.map(function(it){
          var clickFn = it.isTask ? 'openJVDetail('+it.id+')' : 'openDetail('+it.id+')';
          return '<tr onclick="'+clickFn+'" style="cursor:pointer">'
            +'<td><div class="address-cell">'+esc(it.label)+'</div></td>'
            +'<td><span class="badge" style="background:'+typeBg[it.type]+';color:'+typeColor[it.type]+';border-color:'+typeColor[it.type]+'">'+it.type+'</span></td>'
            +'<td><span class="money-val">'+formatMoney(it.offer)+'</span></td>'
            +'<td><span class="arv-val">'+formatMoney(it.arv)+'</span></td>'
            +'<td>'+(it.followUpDate?followUpChip(it.followUpDate):'<span style="color:var(--text4);font-size:11px">&#8212;</span>')+'</td>'
            +'<td>'+esc(it.status||'')+'</td>'
            +'</tr>';
        }).join('')
      +'</tbody></table></div></div>';
  return '<div style="margin-bottom:16px"><h2 style="font-size:16px;font-weight:700">'
    + (score==='Hot'?'&#128308;':score==='Warm'?'&#128993;':'&#128309;') + ' ' + score + ' Leads</h2>'
    + '<p style="font-size:12px;color:var(--text3);margin-top:3px">'+items.length+' '+score+' lead'+(items.length!==1?'s':'')+' across DMV, Nationwide, and Tasks.</p></div>'

    +bulkBarHtml+rows+'</div>';

// ============================================================================
// REVIEW-QUEUE SKIP TRACE — select leads (single/multiple) and send them off to
// the free Radaris skip-trace add-on, which fills in the best WIRELESS number.
// Selection is keyed "kind:id" because Review mixes DMV/D4D leads and Tasks.
// ============================================================================
var reviewSel = new Set();
function rvKey(kind,id){ return kind+':'+id; }
function rvToggle(kind,id,checked){
  var k=rvKey(kind,id);
  if(checked) reviewSel.add(k); else reviewSel.delete(k);
  rvUpdateBar();
}
// Select/clear every checkbox currently shown (works off the live DOM so it
// respects any filtering, and never triggers a full re-render / scroll jump).
function rvToggleAll(checked){
  document.querySelectorAll('.rv-cb').forEach(function(cb){
    cb.checked=checked;
    var k=rvKey(cb.getAttribute('data-kind'), +cb.getAttribute('data-id'));
    if(checked) reviewSel.add(k); else reviewSel.delete(k);
  });
  rvUpdateBar();
}
function rvClearSel(){
  reviewSel.clear();
  document.querySelectorAll('.rv-cb').forEach(function(cb){ cb.checked=false; });
  rvUpdateBar();
}
// Update the count + enable/disable the button, without re-rendering the list.
function rvUpdateBar(){
  var n=reviewSel.size;
  var c=document.getElementById('rv-bulk-count'); if(c) c.textContent=n+' selected';
  var b=document.getElementById('rv-skiptrace-btn'); if(b) b.disabled=(n===0);
}
// Fire the skip trace: gather the selected leads' name+address and hand them to
// the browser add-on via postMessage. If no add-on answers, tell the user how to
// install it (nothing is sent anywhere without it — this is all local/free).
var __rvSkip = null;
function rvSkipTraceSelected(){
  var picks=[];
  reviewSel.forEach(function(k){
    var p=k.split(':'), kind=p[0], id=+p[1];
    var arr=kind==='task'?jvLeads:leads;
    var l=arr.find(function(x){return x.id===id;});
    if(!l) return;
    var address = kind==='task' ? (l.location||'') : (l.address||'');
    var nm = (l.name||'').trim();
    if(/^D4D Lead —/i.test(nm)) nm='';               // strip placeholder owner names
    picks.push({ id:id, kind:kind, name:nm, address:address });
  });
  if(!picks.length){ showToast('Select at least one lead first','error'); return; }
  var missing = picks.filter(function(p){ return !p.address; }).length;
  if(missing===picks.length){ showToast('These leads have no address to trace','error'); return; }

  __rvSkip = { total:picks.length, done:0, found:0, ack:false, jobId:Date.now(), debugs:[] };
  __rvSetProgress('Sending '+picks.length+' lead'+(picks.length!==1?'s':'')+' to skip trace…');
  var btn=document.getElementById('rv-skiptrace-btn'); if(btn) btn.disabled=true;

  window.postMessage({ source:'CRM_SKIPTRACE_REQUEST', jobId:__rvSkip.jobId, leads:picks }, '*');

  // If the add-on never acknowledges, it isn't installed — guide the user.
  setTimeout(function(){
    if(__rvSkip && !__rvSkip.ack){
      __rvSetProgress('');
      var btn2=document.getElementById('rv-skiptrace-btn'); if(btn2) btn2.disabled=(reviewSel.size===0);
      showToast('Skip-trace add-on not detected. Install the "Find Number" browser extension, then (if abroad) set Proton VPN to a US server and try again.','error');
      __rvSkip=null;
    }
  }, 2000);
}
function __rvSetProgress(txt){
  var p=document.getElementById('rv-skip-progress'); if(p) p.textContent=txt;
}
// Results stream back one lead at a time from the add-on.
function __rvHandleResult(d){
  if(!__rvSkip) return;
  if(d.debug){ __rvSkip.debugs.push({ leadId:d.leadId, found:d.found, debug:d.debug }); }
  var arr = d.kind==='task' ? jvLeads : leads;
  var l = arr.find(function(x){return x.id===d.leadId;});
  if(l && d.found && d.phone){
    l.phone = d.phone;
    if(d.carrier || d.lineType){
      var tag = 'Skip trace: '+d.phone+(d.lineType?(' ('+d.lineType+(d.carrier?', '+d.carrier:'')+')'):'')+' — '+new Date().toLocaleDateString();
      l.notes = l.notes ? (l.notes+'\n'+tag) : tag;
    }
    if(d.kind==='task'){ saveJV(); saveJVToSupabase(l); }
    else { save(); saveLeadToSupabase(l); }
    __rvSkip.found++;
  }
  __rvSkip.done++;
  __rvSetProgress('Tracing '+__rvSkip.done+' of '+__rvSkip.total+'…  ('+__rvSkip.found+' found)');
}
function __rvFinish(){
  if(!__rvSkip) return;
  var f=__rvSkip.found, t=__rvSkip.total;
  showToast('Skip trace done: '+f+' of '+t+' number'+(t!==1?'s':'')+' found'+(f<t?', '+(t-f)+' not found':''),'success');
  // DEBUG: when nothing was found, surface the raw page diagnostics so they can
  // be pasted back to fix the TruePeopleSearch selectors. Remove once working.
  if(f===0 && __rvSkip.debugs && __rvSkip.debugs.length){
    var blob=JSON.stringify(__rvSkip.debugs,null,2);
    try{ window.prompt('Skip-trace debug (copy ALL of this and paste it back):', blob); }
    catch(e){ alert(blob); }
    try{ console.log('SKIPTRACE_DEBUG', blob); }catch(e){}
  }
  __rvSkip=null;
  reviewSel.clear();
  renderReviewTab();
}
// One-time listener for messages from the add-on's content script.
if(!window.__rvSkipListenerBound){
  window.__rvSkipListenerBound=true;
  window.addEventListener('message', function(ev){
    if(ev.source!==window) return;              // only same-page (content script) messages
    var d=ev.data||{};
    if(!__rvSkip || d.jobId!==__rvSkip.jobId) return;
    if(d.source==='CRM_SKIPTRACE_ACK'){ __rvSkip.ack=true; __rvSetProgress('Tracing 0 of '+__rvSkip.total+'…'); }
    else if(d.source==='CRM_SKIPTRACE_RESULT'){ __rvHandleResult(d); }
    else if(d.source==='CRM_SKIPTRACE_DONE'){ __rvFinish(); }
  });
}

// Add a lead/task to the Review queue and stamp who sent it + when (used by the Review button on Send and the footer Review button).
async function sendToReview(kind, id){
  var arr = kind==='task' ? jvLeads : leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l) return;
  l.needsReview = true;
  l.reviewSentBy = (currentUser && currentUser.name) || 'Team';
  l.reviewSentAt = new Date().toISOString();
  if(kind==='task'){ saveJV(); render(); await saveJVToSupabase(l); }
  else { localStorage.setItem('crm_leads', JSON.stringify(leads)); render(); await saveLeadToSupabase(l); }
  showToast('Added to Review queue','success');
}
// 🔥 Hot toggle on a Review row — flags a lead to come back to; the row turns red IN PLACE
// (updated in the DOM, no full re-render) so the list never shifts under you. Persists to cloud.
async function toggleD4dHot(id){
  var l = leads.find(function(x){return x.id===id;});
  if(!l) return;
  l.d4dHot = !l.d4dHot;
  save();
  var row = document.getElementById('rrow-lead-'+id);
  if(row){
    row.classList.toggle('hot-row', !!l.d4dHot);
    var btn = row.querySelector('button[onclick*="toggleD4dHot"]');
    if(btn){
      btn.title = l.d4dHot ? 'Hot — click to un-flag' : 'Mark Hot to come back to this lead';
      btn.style.cssText = 'margin-right:6px;font-weight:800;' + (l.d4dHot
        ? 'background:#fff;color:#dc2626;border:1px solid #fff'
        : 'background:none;color:#dc2626;border:1px solid #fca5a5');
    }
  } else {
    render(); // fallback if the row isn't on screen
  }
  var ok = await saveLeadToSupabase(l);
  if(!ok) showToast('Cloud sync failed -- check your connection','error');
}
async function clearReviewComplete(id){
  var l = leads.find(function(x){return x.id===id;});
  if(!l) return;
  l.status = '';
  save(); render();
  var ok = await saveLeadToSupabase(l);
  if(!ok) showToast('Cloud sync failed -- check your connection','error');
}
async function completeReview(kind, id){
  if(typeof id==='undefined'){ id=kind; kind='lead'; } // back-compat if called with just an id
  var arr = kind==='task' ? jvLeads : leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l) return;
  l.needsReview = false;
  if(kind==='task'){ saveJV(); render(); var okT = await saveJVToSupabase(l); if(!okT) showToast('Cloud sync failed -- check your connection','error'); return; }
  l.status = l.status || 'Review Complete';
  save(); render();
  var ok = await saveLeadToSupabase(l);
  if(!ok) showToast('Cloud sync failed -- check your connection','error');
}
function removeFromReview(kind, id){
  if(typeof id==='undefined'){ id=kind; kind='lead'; }
  // Only takes it off the Review queue -- the lead/task itself stays in its database.
  if(!confirm('Remove this from the Review queue?\n\nThe lead/task stays in the CRM.')) return;
  var arr = kind==='task' ? jvLeads : leads;
  var l = arr.find(function(x){return x.id===id;});
  if(!l) return;
  l.needsReview = false;
  if(kind==='task'){ saveJV(); render(); saveJVToSupabase(l).then(function(ok){ if(!ok) showToast('Cloud sync failed -- check your connection','error'); }); return; }
  save(); render();
  saveLeadToSupabase(l).then(function(ok){ if(!ok) showToast('Cloud sync failed -- check your connection','error'); });
}
// Move a DMV/D4D lead into the Tasks tab. Builds a Task (jvLead) from the lead, then removes the
// original lead (soft-delete) so it leaves Review AND the Leads list -- it now lives only as a Task.
// Manual only: fires when the user clicks "Send to Task" (Review row or the lead's edit view).
async function sendLeadToTask(id){
  var l = leads.find(function(x){return x.id===id;});
  if(!l){ showToast('Lead not found','error'); return; }
  if(!confirm('Send this lead to Tasks?\n\n'+(l.address||l.name||'Untitled')
    +'\n\nIt moves out of Review and the Leads list, and appears in the Tasks tab.')) return;
  var maxId = jvLeads.length ? Math.max.apply(null, jvLeads.map(function(x){return x.id;})) : 0;
  var newId = maxId + 1;
  // Carry EVERYTHING the user entered on the lead onto the Task (follow-up, offer, ARV, notes,
  // phone, temperature, beds/baths/sqft, recipient notes, activity history, GHL link).
  var task = {
    id: newId,
    name: l.name || l.ownerName || '',
    phone: l.phone || '',
    score: l.score || '',                              // carry the user-set temperature as-is (blank stays blank)
    notes: l.notes || '',
    fbLink: l.webLink || l.listingLink || '',          // listing / street-view / web link
    sourceGroup: l.leadSource || l.source || '',
    location: l.address || l.location || '',           // full "street, City, ST ZIP"
    askingPrice: l.offer || '',
    arv: l.arv || '',
    profitEst: '',
    followUpDate: l.followUpDate || '',                // ← follow-up date goes with it
    ghlContactId: l.ghlContactId || '',
    jvStatus: '',
    dateAdded: new Date().toISOString().slice(0,10),
    activityLog: (l.activityLog||[]).concat([{ at:new Date().toISOString(),
      by:(currentUser && currentUser.name) || 'Me', note:'Moved from Review to Tasks', type:'Moved to Task' }]),
    recipientNotes: l.recipientNotes || [],
    beds: l.beds||'', baths: l.baths||'', sqft: l.sqft||'',
    reviewSentBy: l.reviewSentBy||'', reviewSentAt: l.reviewSentAt||'', reviewNote: l.reviewNote||'',
    shared:false, sharedAt:'', sharedWith:'', deleted:false, deletedAt:'', needsReview:false
  };
  // CLOUD-FIRST: persist the Task to Supabase BEFORE removing the lead, so a failed sync can
  // never make the lead vanish. If the cloud write fails, we abort and leave the lead in Review.
  var okJV = await saveJVToSupabase(task);
  if(!okJV){
    showToast('Could not save the task to the cloud — lead kept in Review. Check your connection and try again.','error');
    return;
  }
  jvLeads.push(task);
  saveJV();
  // Move the lead's checklist entries (crm_note_items) over to the new Task too (best-effort).
  try {
    await sbFetch(NCI_PATH+'?entity_type=eq.lead&entity_id=eq.'+l.id, 'PATCH',
      { entity_type:'task', entity_id:newId });
    if(typeof nciCache!=='undefined'){ delete nciCache['lead:'+l.id]; delete nciCache['task:'+newId]; }
  } catch(e){ /* checklist migration is best-effort */ }
  // Task is safely in the cloud → now the original lead leaves Review + Leads (soft-delete).
  l.needsReview = false; l.deleted = true; l.deletedAt = new Date().toISOString();
  save();
  var okL = await saveLeadToSupabase(l);
  if(typeof closeModal==='function' && document.querySelector('.modal-overlay')) closeModal();
  activeTab = 'jvleads';
  render();
  showToast(okL ? 'Moved to Tasks' : 'Moved to Tasks — the lead will finish syncing shortly','success');
}

function toggleSelect(id,checked){if(checked)selectedLeads.add(id);else selectedLeads.delete(id);renderLeadsTab();}
function toggleSelectAll(checked){const filtered=getFiltered();const page=filtered.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);if(checked)page.forEach(l=>selectedLeads.add(l.id));else page.forEach(l=>selectedLeads.delete(l.id));renderLeadsTab();}
function clearSelection(){selectedLeads.clear();renderLeadsTab();}
function deleteSelected(){
  const count=selectedLeads.size;
  if(!count) return;
  if(!confirm(`Delete ${count} selected lead${count!==1?'s':''}?`)) return;
  const delIds=[...selectedLeads];
  const now=new Date().toISOString();
  const affected=leads.filter(l=>selectedLeads.has(l.id));
  affected.forEach(l=>{ l.deleted=true; l.deletedAt=now; });
  selectedLeads.clear();save();render();
  affected.forEach(l=>saveLeadToSupabase(l));
  showToast(`Deleted ${count} leads`,'warning',function(){
    affected.forEach(l=>{ l.deleted=false; l.deletedAt=''; });
    save(); render();
    affected.forEach(l=>saveLeadToSupabase(l));
    showToast('Restored','success');
  });
}
function deleteAllFiltered(){
  const filtered=getFiltered();
  if(!filtered.length) return;
  if(!confirm(`Delete ALL ${filtered.length} filtered leads?`)) return;
  const now=new Date().toISOString();
  const affected=filtered.slice();
  affected.forEach(l=>{ l.deleted=true; l.deletedAt=now; });
  selectedLeads.clear();
  filters={search:'',status:'',month:'',source:''};
  activeStatFilter='';
  save();render();
  affected.forEach(l=>saveLeadToSupabase(l));
  showToast(`Deleted ${affected.length} leads`,'warning',function(){
    affected.forEach(l=>{ l.deleted=false; l.deletedAt=''; });
    save(); render();
    affected.forEach(l=>saveLeadToSupabase(l));
    showToast('Restored','success');
  });
}

function addDropdownItem(key){
  const input=document.getElementById('new-'+key);
  const val=input.value.trim();
  if(!val){showToast('Please enter a value','error');return;}
  const dd=getDropdowns();
  if(dd[key].includes(val)){showToast('Already exists!','error');return;}
  dd[key].push(val);saveDropdowns(dd);input.value='';
  showToast('Added: '+val,'success');showDropdownManager();
}
function removeDropdownItem(key,index){
  event.stopPropagation();
  const dd=getDropdowns();
  if(!dd[key]||index<0||index>=dd[key].length) return;
  const item=dd[key][index];
  dd[key].splice(index,1);
  saveDropdowns(dd);
  showToast('Removed: '+item,'warning');
  showDropdownManager();
}

function updateStatusColor(status, prop, value){
  var sc = getStatusColors();
  if(!sc[status]) sc[status] = {bg:'#f1f5f9',color:'#475569',border:'#cbd5e1'};
  sc[status][prop] = value;
  // Auto-set border to slightly darker version of bg
  if(prop==='bg') sc[status].border = value;
  saveStatusColors(sc);
  // Re-render the color list live
  var dd2 = getDropdowns();
  var sc2 = getStatusColors();
  var rows = dd2.statuses.map(function(s){
    var c = sc2[s] || {bg:'#f1f5f9',color:'#475569',border:'#cbd5e1'};
    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">'
      +'<span style="flex:1;font-size:13px;font-weight:600">'+s+'</span>'
      +'<span class="badge" style="background:'+c.bg+';color:'+c.color+';border-color:'+c.border+';min-width:80px;text-align:center">'+s+'</span>'
      +'<label style="font-size:11px;color:var(--text3)">BG</label>'
      +'<input type="color" value="'+c.bg+'" data-status="'+s+'" data-prop="bg" onchange="updateStatusColor(this.dataset.status,this.dataset.prop,this.value)" style="width:32px;height:28px;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:2px">'
      +'<label style="font-size:11px;color:var(--text3)">Text</label>'
      +'<input type="color" value="'+c.color+'" data-status="'+s+'" data-prop="color" onchange="updateStatusColor(this.dataset.status,this.dataset.prop,this.value)" style="width:32px;height:28px;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:2px">'
      +'<button data-status="'+s+'" onclick="resetStatusColor(this.dataset.status)" style="background:var(--surface3);border:1px solid var(--border);color:var(--text3);border-radius:5px;padding:2px 7px;cursor:pointer;font-size:10px">Reset</button>'
      +'</div>';
  }).join('');
  var el = document.getElementById('status-color-list');
  if(el) el.innerHTML = rows;
}

function resetStatusColor(status){
  var sc = getStatusColors();
  delete sc[status];
  saveStatusColors(sc);
  updateStatusColor(status, 'bg', (DEFAULT_STATUS_COLORS[status]||{bg:'#f1f5f9'}).bg);
}
